<h1>Funeral Quest Remastered art pack</h1>
<p>New art in the style of Akiko Robinson's original art, CC BY 4.0 (see manifest.json). Grades: A ships, B acceptable placeholder, C needs an artist.
Compare the twelve redraws with the traced originals in <a href="comparisons.png">comparisons.png</a>.</p>
<main><figure class="k-redraw"><img src="background/background_1.svg" alt="" loading="lazy"><figcaption><b>background/background_1</b> <span class="gB">B</span><br>background/background_1<br><small>Two gnarled trunks arch over a misty path; mossy, cool greens; the pale opening sits behind the customer&#x27;s head.</small></figcaption></figure><figure class="k-redraw"><img src="background/background_2.svg" alt="" loading="lazy"><figcaption><b>background/background_2</b> <span class="gB">B</span><br>background/background_2<br><small>A dark panelled sitting room: drapes and net curtains at a grey window, a wing chair, a fringed lamp; centre kept dark.</small></figcaption></figure><figure class="k-redraw"><img src="background/background_3.svg" alt="" loading="lazy"><figcaption><b>background/background_3</b> <span class="gB">B</span><br>background/background_3<br><small>Under the rafters of a half-ruined church, trusses receding to a glowing arched window, rubble on the floor.</small></figcaption></figure><figure class="k-redraw"><img src="background/background_4.svg" alt="" loading="lazy"><figcaption><b>background/background_4</b> <span class="gB">B</span><br>background/background_4<br><small>A wall of leaves in five greens with pale blossom and red berries at the corners; shaded in the middle.</small></figcaption></figure><figure class="k-redraw"><img src="background/background_5.svg" alt="" loading="lazy"><figcaption><b>background/background_5</b> <span class="gB">B</span><br>background/background_5<br><small>A pink, over-upholstered parlor: sprigged wallpaper, rose carpet, a swagged arch to a viewing room, a lamp and a fern.</small></figcaption></figure><figure class="k-redraw"><img src="background/background_7.svg" alt="" loading="lazy"><figcaption><b>background/background_7</b> <span class="gB">B</span><br>background/background_7<br><small>Moonlit crooked headstones and a tall cross under a starry black sky, ivy and grass in front; follows the original&#x27;s layout.</small></figcaption></figure><figure class="k-redraw"><img src="background/background_celemony.svg" alt="" loading="lazy"><figcaption><b>background/background_celemony</b> <span class="gB">B</span><br>background/background_celemony<br><small>The cemetery by day: flat markers in rows on dry grass, a few upright stones, soft trees, pale sky; horizon kept where the ceremony fg expects it.</small></figcaption></figure><figure class="k-redraw"><img src="background/background_church.svg" alt="" loading="lazy"><figcaption><b>background/background_church</b> <span class="gB">B</span><br>background/background_church<br><small>The nave: pews either side of the aisle, the altar and its wooden cross, stained glass at left throwing light, three saints at right.</small></figcaption></figure><figure class="k-redraw"><img src="places/bank.svg" alt="" loading="lazy"><figcaption><b>places/bank</b> <span class="gB">B</span><br>places/bank<br><small>Prudence Ledbetter (the Expanded teller) behind brass bars counting bills, the EXCHANGE plate top left as in the original, ledgers, clock and window behind. The small figure is the weakest part.</small></figcaption></figure><figure class="k-redraw"><img src="places/fire.svg" alt="" loading="lazy"><figcaption><b>places/fire</b> <span class="gB">B</span><br>places/fire<br><small>A clapboard parlor ablaze at night, flames from every window and the roof, two firefighters rim-lit by the fire hosing it down.</small></figcaption></figure><figure class="k-redraw"><img src="places/palors.svg" alt="" loading="lazy"><figcaption><b>places/palors</b> <span class="gB">B</span><br>places/palors<br><small>One-point street of parlors in fog, drawn in perspective with gas lamps and gilt crosses.</small></figcaption></figure><figure class="k-redraw"><img src="places/store.svg" alt="" loading="lazy"><figcaption><b>places/store</b> <span class="gB">B</span><br>places/store<br><small>The Di-Mart casket aisle: racked caskets in six finishes on red racking, receding to the DI-MART banner; centre kept calm for the store clerk.</small></figcaption></figure><figure class="k-place"><img src="places/bank-vault.svg" alt="" loading="lazy"><figcaption><b>places/bank-vault</b> <span class="gB">B</span><br>new<br><small>The vault: the round door swung open on its hinge, deposit boxes, gold bars and money sacks lit warm inside, riveted steel walls.</small></figcaption></figure><figure class="k-place"><img src="places/bingo-night.svg" alt="" loading="lazy"><figcaption><b>places/bingo-night</b> <span class="gB">B</span><br>new<br><small>The church hall: BINGO TONIGHT banner, the B-I-N-G-O lamp board, the ball tumbler, folding tables with cards and daubers, the jar of wooden tags for the pot.</small></figcaption></figure><figure class="k-place"><img src="places/black-market.svg" alt="" loading="lazy"><figcaption><b>places/black-market</b> <span class="gB">B</span><br>new<br><small>A faceless dealer under a bare bulb behind a red-clothed table: rabbit&#x27;s foot, Kevlar vest with one hole, the gold casket off a truck, a forged permit, a filed gold tag, tap holy water; crates.</small></figcaption></figure><figure class="k-place"><img src="places/city-hall.svg" alt="" loading="lazy"><figcaption><b>places/city-hall</b> <span class="gB">B</span><br>new<br><small>A pompous little classical hall: clock tower, pediment and CITY HALL frieze, fluted columns, flags, and the Mayor&#x27;s bronze statue pointing at something important, with a pigeon.</small></figcaption></figure><figure class="k-place"><img src="places/graveyard.svg" alt="" loading="lazy"><figcaption><b>places/graveyard</b> <span class="gB">B</span><br>new<br><small>Mounds and headstones receding into dense fog under a veiled moon, a dead tree with crows, an iron fence; the Design Doc&#x27;s &#x27;dense fog covers the many mounds and headstones&#x27;.</small></figcaption></figure><figure class="k-place"><img src="places/graveyard-duel.svg" alt="" loading="lazy"><figcaption><b>places/graveyard-duel</b> <span class="gB">B</span><br>new<br><small>The same graveyard with an open grave front and centre, a heap of earth with two crossed shovels and a lantern; upper left kept plain for the power bars.</small></figcaption></figure><figure class="k-place"><img src="places/mayor-office.svg" alt="" loading="lazy"><figcaption><b>places/mayor-office</b> <span class="gB">B</span><br>new<br><small>Panelled office: his own portrait in gilt, flags, venetian blinds, an oxblood chair centred for the Mayor&#x27;s bust, a vast desk with THE MAYOR nameplate, permits, stamp and cigar.</small></figcaption></figure><figure class="k-place"><img src="places/parlor-1.svg" alt="" loading="lazy"><figcaption><b>places/parlor-1</b> <span class="gB">B</span><br>new<br><small>The Shack: weathered boards, a hole in the green roof, a boarded window and a crooked cross; dirt yard.</small></figcaption></figure><figure class="k-place"><img src="places/parlor-2.svg" alt="" loading="lazy"><figcaption><b>places/parlor-2</b> <span class="gB">B</span><br>new<br><small>The Fixer-Upper: fresh cream clapboard, green shutters, a porch on two posts, a FUNERAL sign in the yard.</small></figcaption></figure><figure class="k-place"><img src="places/parlor-3.svg" alt="" loading="lazy"><figcaption><b>places/parlor-3</b> <span class="gB">B</span><br>new<br><small>Respectable: two white storeys, a pedimented portico, chimney, picket fence and shrubs.</small></figcaption></figure><figure class="k-place"><img src="places/parlor-4.svg" alt="" loading="lazy"><figcaption><b>places/parlor-4</b> <span class="gB">B</span><br>new<br><small>Chapel House: the Respectable house with a stone chapel wing, rose window and a steeple.</small></figcaption></figure><figure class="k-place"><img src="places/parlor-5.svg" alt="" loading="lazy"><figcaption><b>places/parlor-5</b> <span class="gB">B</span><br>new<br><small>Colonial Mansion: two wings, a four-column portico with fanlight door, dormers, a family mausoleum and lamps.</small></figcaption></figure><figure class="k-place"><img src="places/parlor-office.svg" alt="" loading="lazy"><figcaption><b>places/parlor-office</b> <span class="gB">B</span><br>new<br><small>The undertaker&#x27;s own office: licence on the wall, the fog through the window, a filing cabinet with a casket catalogue, the desk with ledger, telephone, lamp and urn, and Morty on his stand in the corner.</small></figcaption></figure><figure class="k-place"><img src="places/prep-cosmetics.svg" alt="" loading="lazy"><figcaption><b>places/prep-cosmetics</b> <span class="gB">B</span><br>new<br><small>The make-up station: a bulb-ringed mirror, powder, rouge, lipstick, brushes, a comb, a wig on a stand and a photo of the deceased for reference.</small></figcaption></figure><figure class="k-place"><img src="places/prep-table.svg" alt="" loading="lazy"><figcaption><b>places/prep-table</b> <span class="gB">B</span><br>new<br><small>A body under a sheet on the steel table, a toe tag, instruments, the pump; cold tiles under the operating lamp.</small></figcaption></figure><figure class="k-place"><img src="places/prep-viewing.svg" alt="" loading="lazy"><figcaption><b>places/prep-viewing</b> <span class="gB">B</span><br>new<br><small>The open casket on its bier between candelabra, lined in satin, a nose and folded hands holding a rose, white lilies, red drapes.</small></figcaption></figure><figure class="k-place"><img src="places/reaper-club.svg" alt="" loading="lazy"><figcaption><b>places/reaper-club</b> <span class="gB">B</span><br>new<br><small>A rave for funeral directors: lit floor tiles, beams of purple and teal, top-hatted mourners dancing, a skull disco ball, DJ MORT&#x27;s coffin booth, the VIP booth that is a hearse with the back off, a back-lit bar.</small></figcaption></figure><figure class="k-place"><img src="places/reaper-club-door.svg" alt="" loading="lazy"><figcaption><b>places/reaper-club-door</b> <span class="gB">B</span><br>new<br><small>A black studded
