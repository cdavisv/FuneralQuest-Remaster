name: Release desktop

# Builds the Tauri desktop app for Linux, Windows and macOS (unsigned) and uploads the installers
# as workflow artifacts. Run it by hand (Actions > Release desktop > Run workflow) or push a tag
# such as v0.1.0, which also attaches the files to a draft GitHub release.
# Signing and notarisation are described in docs/release/BUILDING.md.
on:
  workflow_dispatch:
    inputs:
      default_server:
        description: "Default server address baked into the app (optional; players can change it)"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (deb, AppImage)
            os: ubuntu-22.04
            args: --bundles deb,appimage
          - name: Windows (NSIS installer)
            os: windows-latest
            args: --bundles nsis
          - name: macOS Apple silicon (dmg)
            os: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
          - name: macOS Intel (dmg)
            os: macos-15-intel
            args: --target x86_64-apple-darwin --bundles dmg
    env:
      FQ_DEFAULT_SERVER: ${{ inputs.default_server }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Linux system libraries
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: pnpm install --frozen-lockfile
      # beforeBuildCommand (apps/desktop/scripts/build-client.mjs) builds the client first.
      - name: Build
        working-directory: apps/desktop
        env:
          NO_STRIP: "true"
        run: pnpm exec tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: funeral-quest-desktop-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/*/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/*
