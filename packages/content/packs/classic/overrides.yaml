# Classic = Vintage (the untouched 2001 text) plus the edits below, and nothing else.
#
# Policy (docs/REMASTER_PLAN.md 3.2). Edit only:
#   - lines that sexualise minors or put children in sexual or abusive jokes          (minors)
#   - slurs aimed at groups, ethnic or class                                          (slur)
#   - the mock broken English given to the Yang's restaurant characters               (stereotype)
#   - real people used as insults or as an endorsement                                (real-person)
#   - real brands used as insults or in ways that suggest endorsement                 (real-brand)
# Swearing, gross-out humour, death jokes and satire of the funeral industry stay.
#
# Rules the build enforces:
#   - `original` is found exactly once in table `in` of the Vintage pack, or the build fails;
#   - a replacement keeps the {placeholders} and *TOKENS* of the original;
#   - entries are replaced, never removed, so table lengths and the engine's random draws do not
#     change.
# packages/content/EDITS.md explains each edit for the project owner.

edits:
  # --- Yang's fortune cookies: mock broken English -------------------------------------------
  - id: fortune-watch-toilet
    category: stereotype
    in: fortunes
    original: "Man who drop watch in toilet bound to have crappy time."
    replacement: "Whoever drops a watch in the toilet is bound to have a crappy time."
    reason: "Mock broken-English fortune; same pun, plain deadpan English."
  - id: fortune-stand-on-toilet
    category: stereotype
    in: fortunes
    original: "Man who stand on toilet is high on pot."
    replacement: "Anyone who stands on the toilet is high on pot."
    reason: "Mock broken-English fortune; same pun, plain deadpan English."
  - id: fortune-four-balls
    category: stereotype
    in: fortunes
    original: "Baseball wrong.  Man with four balls no walk."
    replacement: "Baseball is wrong.  A man with four balls cannot walk."
    reason: "Mock broken-English fortune; same pun, plain deadpan English."
  - id: fortune-run-behind-car
    category: stereotype
    in: fortunes
    original: "Man who run behind car get exhausted."
    replacement: "Anyone who runs behind a car gets exhausted."
    reason: "Mock broken-English fortune; same pun, plain deadpan English."

  # --- Children in abusive or predatory jokes ------------------------------------------------
  - id: karma-beats-kids
    category: minors
    in: karma
    original: "Beats kids"
    replacement: "Kicks puppies"
    reason: "Child abuse as a punchline; the slot stays an evil-karma title."
  - id: karma-candy-to-kids
    category: minors
    in: karma
    original: "Gives 'candy' to kids"
    replacement: "Steals candy from the church bake sale"
    reason: "Predator innuendo aimed at children; the slot stays an evil-karma title."
  - id: sympathy-really-close
    category: minors
    in: text
    original: "but we were REALLY close if you know what I mean."
    replacement: "but we were REALLY close, we even shared a toothbrush."
    reason: "Incest innuendo that can pair with a child customer or a child deceased (any relation, any age)."

  # --- Class slur -----------------------------------------------------------------------------
