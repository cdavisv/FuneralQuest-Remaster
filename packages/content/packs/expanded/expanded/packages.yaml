        - 'prestige'
      requires: 'florist-cooler'
  pitch:
    - "`w{player}: `$\"Nothing says 'we tried' like {article} {upgrade}. Only ${price}.\"\n\n"
    - "`w{player}: `$\"A {last} is... a choice. A brave one. Most families go with {article} {upgrade} for ${price}.\"\n\n"
    - "`w{player}: `$\"Flowers hide a multitude of smells. {upgrade}, ${price}. Trust me on the smells.\"\n\n"
    - "`w{player}: `$\"One {last}. On a whole casket. People will think you picked it up off the floor of the hospital. {upgrade}, ${price}.\"\n\n"
    - "`w{player}: `$\"{dFirst} loved flowers. I assume. Everybody loves flowers. {upgrade}, ${price}.\"\n\n"
    - "`w{player}: `$\"The other mourners will bring flowers, {cSir}. Do you want theirs to be bigger? {upgrade} is ${price}.\"\n\n"
    - "`w{player}: `$\"I can do {article} {upgrade} for ${price}. Fresh from the cooler, not from the cemetery next door.\"\n\n"
    - "`w{player}: `$\"Lilies are the flower of death, which in my line of work makes them the flower of business. {upgrade}, ${price}.\"\n\n"
    - "`w{player}: `$\"If you squint, {article} {upgrade} looks like love. ${price}.\"\n\n"
    - "`w{player}: `$\"The {last} came free. You can tell, can't you? Everyone can tell. {upgrade}, ${price}.\"\n\n"
    - "`w{player}: `$\"A {last} wilts by the eulogy. {upgrade} lasts until the will reading. ${price}.\"\n\n"
    - "`w{player}: `$\"Father Smyth is allergic to {upgrade}, which is one more reason to get it. ${price}.\"\n\n"
