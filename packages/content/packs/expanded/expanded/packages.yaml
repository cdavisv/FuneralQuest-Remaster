  pitch:
    - "`w{player}: `$\"Termites love a {last}. {article} {upgrade}, on the other hand, lasts until the sun explodes. ${price}.\"\n\n"
    - "`w{player}: `$\"People will walk past {dHim} for a hundred years. Give them something to look at: {article} {upgrade}, ${price}.\"\n\n"
    - "`w{player}: `$\"Our most popular model with families who loved the deceased? {article} {upgrade}. ${price}. Just saying.\"\n\n"
    - "`w{player}: `$\"A {last} says 'here lies somebody'. {article} {upgrade} says 'here lies {dFirst} {surname}, and we paid for it'. ${price}.\"\n\n"
    - "`w{player}: `$\"The groundskeeper mows right over a {last}. He's mowed over three this month. {upgrade}, ${price}.\"\n\n"
    - "`w{player}: `$\"You get one sentence on a {last}. On {article} {upgrade} you get a paragraph and a little picture. ${price}.\"\n\n"
    - "`w{player}: `$\"Every grave around {dHim} will be taller than a {last}. Don't let {dHim} get looked down on forever. ${price} for {article} {upgrade}.\"\n\n"
    - "`w{player}: `$\"Pigeons respect {article} {upgrade}. Pigeons do not respect a {last}. ${price}.\"\n\n"
    - "`w{player}: `$\"The kids from Spirit University use the {last}s for kindling. Nobody burns {article} {upgrade}. ${price}.\"\n\n"
    - "`w{player}: `$\"A headstone is a business card for eternity, {cSir}. Make it {article} {upgrade}. ${price}.\"\n\n"
    - "`w{player}: `$\"I'd go {upgrade}. ${price}. The engraver is very good. He only misspelled two names last year.\"\n\n"
    - "`w{player}: `$\"Picture the family photos at {article} {upgrade}. Now picture them crouching next to a {last}. ${price}.\"\n\n"
