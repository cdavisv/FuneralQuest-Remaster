# Package ladders (docs/expanded-rules.md section 5.1). Tier 0 is free and included; each tier
# is dearer than the last; a tier may need a parlor upgrade (put those at the top: the ladder is
# climbed one tier at a time) and may pay plot income. Pitches: {upgrade} {article} {price} {last}.
- id: 'embalming'
  label: 'Embalming'
  track: 'any'
  tiers:
    - article: ''
      name: 'No Embalming'
      price: 0
      tags: []
    - article: 'a'
      name: 'Basic Embalming'
      price: 400
      tags:
        - 'embalming'
    - article: 'a'
      name: 'Full Reconstruction'
      price: 900
      tags:
        - 'embalming'
        - 'vanity'
    - article: 'an'
      name: 'Air-Brushed Embalming'
      price: 1500
      tags:
        - 'embalming'
        - 'vanity'
        - 'prestige'
      requires: 'embalming-lab'
    - article: 'a'
      name: 'Museum-Grade Preservation'
      price: 2500
      tags:
        - 'embalming'
        - 'prestige'
      requires: 'embalming-lab'
    - article: 'a'
      name: 'Lifelike Pose (Seated, Waving)'
      price: 3500
      tags:
        - 'embalming'
        - 'vanity'
        - 'prestige'
      requires: 'embalming-lab'
  pitch:
    - "`w{player}: `$\"Embalming is, uh, required by the state for, uh, disease reasons. Yeah. Required. {upgrade} is only ${price}.\"\n\n"
    - "`w{player}: `$\"You want people to remember {dHim} looking peaceful, not looking like {aFridge} fell on {dHim}. {upgrade}, ${price}.\"\n\n"
    - "`w{player}: `$\"A {last}? For your {dRelation}? Let's talk about {upgrade}. ${price} and {dHe}'ll look better than at the wedding.\"\n\n"
    - "`w{player}: `$\"Without embalming, the viewing has a, let's say, countdown. {upgrade} stops the clock. ${price}.\"\n\n"
    - "`w{player}: `$\"I can make {dFirst} look ten years younger. Fifteen with {upgrade}. ${price}, and nobody has to know about the {dFridge}.\"\n\n"
    - "`w{player}: `$\"{upgrade}: ${price}. Think of it as a spa day {dHe} never got around to.\"\n\n"
    - "`w{player}: `$\"The {last} works fine in winter, {cSir}. It is not winter.\"\n\n"
    - "`w{player}: `$\"We use only the finest fluids. The {last} uses whatever's in the jug. {upgrade} is ${price}.\"\n\n"
    - "`w{player}: `$\"Picture the open casket. Now picture it with {upgrade}. Now stop picturing it without. ${price}.\"\n\n"
    - "`w{player}: `$\"Your {dRelation} survived a lot of things, {cSir}. Gravity was not one of them. {upgrade} fixes the face. ${price}.\"\n\n"
    - "`w{player}: `$\"Some families skip embalming and regret it about an hour into the viewing. {upgrade}, ${price}.\"\n\n"
    - "`w{player}: `$\"For ${price}, {upgrade} means {dFirst} looks asleep instead of, you know. The other thing.\"\n\n"
    - "`w{player}: `$\"I've had relatives faint at a {last}. One sued. {upgrade} is ${price} and nobody faints.\"\n\n"
