  pitch:
    - "`w{player}: `$\"A {last}. For your {dRelation}. On your mantel. Next to the good china. Or, {article} {upgrade} for ${price}.\"\n\n"
    - "`w{player}: `$\"{upgrade}, ${price}. Because 'shake and bake' doesn't have to mean 'cheap'.\"\n\n"
