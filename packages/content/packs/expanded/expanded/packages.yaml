  pitch:
    - "`w{player}: `$\"The {last} is right next to the drainage ditch. {upgrade} has a view. Of other graves, but still. ${price}.\"\n\n"
    - "`w{player}: `$\"Location, location, location. {upgrade}, ${price}. The neighbors are very quiet.\"\n\n"
    - "`w{player}: `$\"You wouldn't put {dHim} in a {last} forever, would you? {upgrade} is only ${price}.\"\n\n"
    - "`w{player}: `$\"The {last} floods every spring. {dFirst} would be the first to float past the church. {upgrade}, ${price}.\"\n\n"
    - "`w{player}: `$\"Real estate never loses value, {cSir}. Except in Blaine. {upgrade}, ${price}.\"\n\n"
    - "`w{player}: `$\"{upgrade} comes with perpetual care. Perpetual is a long time. ${price} is a short price.\"\n\n"
    - "`w{player}: `$\"You'll want somewhere nice to visit. Or somewhere nice to not visit and feel bad about. {upgrade}, ${price}.\"\n\n"
    - "`w{player}: `$\"Our {last} section backs onto the Bill's Big Burger dumpsters. {upgrade} does not. ${price}.\"\n\n"
    - "`w{player}: `$\"The Mayor has his eye on that {upgrade}. Let's beat him to it. ${price}.\"\n\n"
    - "`w{player}: `$\"A {last} is fine if you like being stepped on. {upgrade}, ${price}, nobody steps on {dHim} there.\"\n\n"
    - "`w{player}: `$\"Think of {upgrade} as a retirement home where {dHe} finally doesn't complain. ${price}.\"\n\n"
    - "`w{player}: `$\"Old Man Withers has been eyeing {upgrade} since 1974. Get it before he finally needs it. ${price}.\"\n\n"
