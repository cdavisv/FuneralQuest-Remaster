  - "`w{player}: `$\"Have a coffee and look at the brochures. No pressure. Some pressure.\"\n\n"
  - "`w{player}: `$\"This coffee is so good people have died for it. Not here. Mostly not here.\"\n\n"
  - "`w{player}: `$\"Let's pause and have a cup. Grief is a marathon, coffee is the water station.\"\n\n"
  - "`w{player}: `$\"I'll make a fresh pot. You just sit there and feel your feelings.\"\n\n"
  - "`w{player}: `$\"Coffee? It's from the Pale Horse Cafe. I take a pot every morning. They know.\"\n\n"
  - "`w{player}: `$\"Let me get you a cup. The machine makes a noise like a death rattle. It's fine. It's the machine.\"\n\n"
  - "`w{player}: `$\"I've got coffee, tea, or hot water in a cup. Hot water is the house special.\"\n\n"
  - "`w{player}: `$\"Milk? It's fresh. Fresh-ish. Smell it first.\"\n\n"
  - "`w{player}: `$\"How about a cup of coffee before we talk numbers? Numbers go down easier with caffeine.\"\n\n"
  - "`w{player}: `$\"Here, let me pour. Not that mug, that's Morty's. Morty's my skeleton. He doesn't drink, it's sentimental.\"\n\n"
  - "`w{player}: `$\"Coffee break! For you. I'll keep talking, but you'll have a cup, which is like a break.\"\n\n"
  - "`w{player}: `$\"I'll put the pot on. In this business we go through a lot of coffee. Long nights. Quiet company.\"\n\n"
  - "`w{player}: `$\"Coffee? Father Smyth swears by it. Well, he swears near it. Mostly at the bingo results.\"\n\n"
  - "`w{player}: `$\"I got this coffee at Di-Mart. Elijah said it was \"for occasions of grief\". It's the regular kind with a black label.\"\n\n"
  - "`w{player}: `$\"Sugar? We have cubes, packets, and a bowl of something that was sugar before the humidity.\"\n\n"
