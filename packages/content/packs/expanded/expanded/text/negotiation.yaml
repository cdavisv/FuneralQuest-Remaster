request:
  - '{customer}"My {dRelation} {dFirst} was {dSmashed} {aFridge}. I need a {casket} casket and a plot. Can you do it?"'
  - '{customer}"It''s {dFirst}. My {dRelation}. {AFridge} was involved. I was thinking a {casket} casket?"'
  - '{customer}"I need to bury my {dRelation}. {dFirst} would have wanted {casket}. Or so {dHe} said, loudly, often."'
  - '{customer}"{dFirst} is gone. {AFridge} was involved, if you can believe it. Something {casket}, please."'
  - '{customer}"Hi. Um. My {dRelation} died. {AFridge} was involved. I don''t want to talk about the {dFridge}. Just a {casket} casket."'
  - '{customer}"I''m here about {dFirst}. {dHeCap} was {dSmashed} {aFridge} on Tuesday. What does a {casket} casket run these days?"'
  - '{customer}"The hospital gave me your card. And {dFirst}''s shoes. I need a {casket} casket and somewhere to put the shoes."'
  - '{customer}"My {dRelation} {dFirst} has died. I''m told that means I need a {casket} casket and a lot of forms."'
  - '{customer}"{dFirst} always said, "When I go, put me in {casket}." Then {dHe} was {dSmashed} {aFridge}. So. {casket}."'
  - '{customer}"Is this the funeral place? Your sign fell off. My {dRelation} needs burying. A {casket} casket, nothing silly."'
  - '{customer}"It was {aFridge}. Of all the things. I''d like a {casket} casket for {dFirst}, please."'
  - '{customer}"I''ve never done this before. My {dRelation} {dFirst} died. Do I just say "{casket} casket" and you do the rest?"'
  - '{customer}"Father Smyth sent me. {dFirst} was {dSmashed} {aFridge}. He said you''d know what a {casket} casket costs. He made a face."'
  - '{customer}"My {dRelation} is dead and the {dFridge} is fine. Life isn''t fair. I need a {casket} casket."'
  - '{customer}"We need to bury {dFirst}. The family voted on a {casket} casket. The vote was close. There was shouting."'
  - '{customer}"{dFirst} {surname}. That''s who. {AFridge}. That''s how. {casket}. That''s the casket."'
  - '{customer}"I''ll be honest, I don''t know what I''m doing. {dFirst} handled everything. Now I need a {casket} casket for {dHim}."'
petRequest:
  - '{customer}"{dFirst} needs a proper send-off. A {casket} casket. A small one. Unless {pet}s come in medium?"'
  - '{customer}"This is {dFirst}. {dFirst} was a {pet}. Do you do {casket} caskets in a {pet} size?"'
  - '{customer}"The vet said "try the funeral home." So. {dFirst} the {pet}. Something {casket}. With a little pillow."'
  - '{customer}"{dFirst} chewed through a lot of things in {dHis} life. A {casket} casket would be the first thing {dHe} couldn''t."'
  - '{customer}"My {pet} {dFirst} has gone to the big yard in the sky. I want a {casket} casket and I don''t want anyone to laugh."'
  - '{customer}"I know it''s a {pet}. I know. But {dFirst} was family. {casket}, please. And a little headstone. You don''t do headstones? Fine."'
  - '{customer}"Please don''t make the shoebox joke. Everyone makes the shoebox joke. {dFirst} deserves a {casket} casket."'
  - '{customer}"{dFirst} was the best {pet} in Deathville. Ask anyone. Ask the mailman, actually, don''t. A {casket} casket, please."'
  - '{customer}"The whole family wants a real funeral for {dFirst}. My wallet wants a shoebox. Let''s say {casket} and see who wins."'
selfRequest:
  - '{customer}"Put me down for a {casket} casket. I''ll be using it eventually, so don''t skimp."'
  - '{customer}"I''m not dead. I''m planning ahead. I want a {casket} casket and I want it to say "I told you so" on the lid."'
  - '{customer}"My doctor gave me six months. That was in 1998. I''d still like to pick my {casket} casket while I can walk to the showroom."'
  - '{customer}"My family will cheap out, I know them. Lock me in now: a {casket} casket, and I''m paying today."'
  - '{customer}"Show me a {casket} casket. I''m going to lie in it. Don''t make that face, I need to know if it''s comfortable."'
  - '{customer}"Last time I let the family plan anything, we ended up at Bill''s Big Burger. I''m picking my own {casket} casket."'
  - '{customer}"Nobody''s dead. Yet. I''m getting my affairs in order, starting with a {casket} casket and ending with a grudge."'
  - '{customer}"I''d like to be buried in a {casket} casket, eventually. Can I pay in installments? Can the installments outlive me?"'
  - '{customer}"I read that planning ahead saves your family stress. I don''t care about their stress. I care about the {casket} casket."'
repeat:
  happy:
    - '{customer}"We came back because of how you handled Grandpa. The whole {surname} family says hello."'
    - '{customer}"You did such a lovely job last time. We just keep dying, us {surname}s."'
    - '{customer}"Remember the {surname}s? You buried Uncle Ray. Beautiful job. He looked better than he did at Easter."'
    - '{customer}"Mom said, "When the time comes, go back to that nice crook." So here we are."'
    - '{customer}"The {surname} family is back. Don''t look so surprised, we die a lot."'
    - '{customer}"You did right by us last time. The whole {surname} clan still talks about the punch and cookies."'
    - '{customer}"We''ve told everyone about you. Well, everyone who''s still alive. That''s fewer people every week."'
    - '{customer}"Last time you made Aunt Bev cry the good kind of tears. Let''s do that again."'
  ok:
    - '{customer}"You buried my other relative. It was fine. I suppose you''ll do."'
    - '{customer}"The {surname}s again. Last funeral was fine. The coffee was cold. Let''s see if you''ve improved."'
    - '{customer}"You buried one of ours. Nobody complained. Nobody cheered either."'
    - '{customer}"We''re back. Not because you were great. Because you were close."'
    - '{customer}"My cousin said you were "okay, I guess". That''s a strong review from a {surname}."'
    - '{customer}"You did the {surname} funeral last time. It happened. That''s all I remember about it."'
    - '{customer}"Back again. Same family, different corpse."'
    - '{customer}"Your parlor came up at dinner. Someone said "fine". Someone else said "fine, I suppose". So here I am."'
  sour:
    - '{customer}"Last time you sold us {aFridge}-proof casket. It wasn''t. We''re watching you."'
    - '{customer}"The {surname} family remembers last time. We''re only here because the other place is closed."'
    - '{customer}"Last time you charged us for "casket ventilation". There''s no such thing. I looked it up."'
    - '{customer}"The {surname}s haven''t forgotten the business with the flowers. Grandma had a white nose for a week."'
    - '{customer}"I''m only here because everyone in Blaine is booked solid. Behave."'
    - '{customer}"Last funeral, your hearse got lost. With Grandpa in it. For three hours."'
    - '{customer}"We still have the bill from last time framed in the hallway. As a warning."'
    - '{customer}"You''re on thin ice, pal. The {surname}s talk. Mostly about you, lately."'
  walked:
    - '{customer}"The {surname}s don''t forget. You treated us like garbage. Convince me otherwise. Fast."'
    - '{customer}"The last {surname} who came in here walked out with Grandma still unburied. Give me one reason to stay."'
    - '{customer}"You treated my brother like dirt. He went across the street. They gave him a mint. A MINT."'
    - '{customer}"We don''t like you. We''re here because every other parlor is closed for the chili cook-off."'
    - '{customer}"The {surname}s have a list. You''re on it. Top half."'
    - '{customer}"My mother walked out of here in tears last time. Not the sad kind. The furious kind."'
    - '{customer}"Every {surname} at Thanksgiving had a story about you. None of them were nice. Start talking."'
    - '{customer}"I''ll give you exactly one chance, because I promised my aunt. She''s dead, so she won''t check."'
estimate: '`wYou figure {cHe} can spend between ${low} and ${high}.`$'
resistance: '`wYou successfully analyze {cHis} resistance.`$'
psychTell: '`wYou notice something:`$ '
nothingExtra: '`$You can''t read anything else about {cHim} yet.'
bonusRule: '`5Bonus if the bill lands within `#{nice}%`5 of what {cHe} can pay, more within `#{great}%`5, and a lot for the exact amount.'
total: "\n\nTotal: ${price}"
buttons:
  coffee: 'Coffee'
  listen: 'Listen'
  discount: 'Discount'
  packages: 'Packages'
  back: 'Back'
  cremation: 'Cremation'
  bless: 'Bless'
  raise: 'Raise Mourners'
hints:
  coffeeUsed: 'Already had coffee'
  nothingToLearn: 'Nothing more to learn'
  discountMax: 'No more discounts'
  discountTooSmall: 'The bill is too small to discount'
  hardMaxed: 'Already the best casket'
  cremationTrack: 'Cremation: no casket to upgrade'
  noPackages: 'Nothing left to upgrade'
  blessUsed: 'Already blessed'
  raiseUsed: 'The mourners are already up'
  handEmpty: 'Nothing left to offer'
  needsUpgrade: 'Your parlor can''t offer this yet'
handIntro: '`$Which do you pitch?'
packagesIntro: '`$Which part of the funeral do you upgrade?'
softPitch:
  - "`w{player}: `$\"Most families in your situation go with {article} {item}. ${price}, and it says 'we cared' without saying 'we cared a lot'.\"\n\n"
  - "`w{player}: `$\"{dFirst} would have loved {article} {item}. I didn't know {dHim}, but I feel it. ${price}.\"\n\n"
  - "`w{player}: `$\"For just ${price}, {article} {item} will make the other mourners feel cheap. Isn't that what this is about?\"\n\n"
  - "`w{player}: `$\"We're running a special on {item}. It's ${price}. That's the special price. It's always the special price.\"\n\n"
  - "`w{player}: `$\"You know what this funeral needs? {item}. ${price}. Don't ask me why, I just feel it.\"\n\n"
  - "`w{player}: `$\"I shouldn't tell you this, but the mayor's mother had {article} {item}. ${price}.\"\n\n"
  - "`w{player}: `$\"Grief is a journey, {cSir}, and every journey needs {article} {item}. ${price}.\"\n\n"
  - "`w{player}: `$\"A lot of people regret not getting {article} {item}. For about a week. Then they forget. ${price}.\"\n\n"
  - "`w{player}: `$\"I'd hate for you to wake up at 3 a.m. wishing you'd gotten {article} {item}. ${price}.\"\n\n"
  - "`w{player}: `$\"The {item} is very popular this season. Death has seasons. ${price}.\"\n\n"
  - "`w{player}: `$\"${price} for {article} {item}. Think of it as an investment in being talked about.\"\n\n"
  - "`w{player}: `$\"Elijah at Di-Mart sells {article} {item} for half this. Elijah also sells bait. Ours is ${price} and has never touched a worm.\"\n\n"
  - "`w{player}: `$\"The Blaine Funeral Home doesn't even offer {article} {item}. That's why Blaine is sad. ${price}.\"\n\n"
  - "`w{player}: `$\"I'm legally required to tell you about {article} {item}. I'm not, but I like telling people. ${price}.\"\n\n"
  - "`w{player}: `$\"{dFirst} can't take it with {dHim}. But {dHe} can take {article} {item}. ${price}.\"\n\n"
  - "`w{player}: `$\"Father Smyth calls {article} {item} \"the least you could do\". Father Smyth is a very good customer. ${price}.\"\n\n"
  - "`w{player}: `$\"Picture the wake. Everyone's talking about {dFirst}. Then someone whispers, \"Is that {article} {item}?\" ${price}.\"\n\n"
  - "`w{player}: `$\"Our {item} comes with a lifetime guarantee. {dFirst}'s lifetime, so the paperwork is very simple. ${price}.\"\n\n"
  - "`w{player}: `$\"I'll be honest with you, {cSir}. I'm not always honest. But {article} {item} for ${price} is a fair deal.\"\n\n"
  - "`w{player}: `$\"Morty, my skeleton, recommends {article} {item}. He doesn't say much. He sort of leans. ${price}.\"\n\n"
  - "`w{player}: `$\"Everyone at the service will want something to look at that isn't {dFirst}. Give them {article} {item}. ${price}.\"\n\n"
  - "`w{player}: `$\"The {surname} name deserves {article} {item}. I don't know the {surname} name. It sounds deserving. ${price}.\"\n\n"
hardPitchWood:
  - "`w{player}: `$\"Wood is fine, if {dFirst} was a hamster. Silver is only ${price} more.\"\n\n"
  - "`w{player}: `$\"Our wood caskets are made from genuine leftover pallets. Silver, on the other hand, ${price} more, keeps the raccoons out.\"\n\n"
  - "`w{player}: `$\"Wood rots, {cSir}. In about a week, in this soil. Silver is ${price} more.\"\n\n"
  - "`w{player}: `$\"I could put {dHim} in wood. I could also put {dHim} in a trash bag. Silver is ${price} more and has handles.\"\n\n"
  - "`w{player}: `$\"The silver model has a pillow. The wood model has splinters. ${price} difference.\"\n\n"
  - "`w{player}: `$\"Do you want people whispering 'wood' at the viewing? Silver is ${price} more.\"\n\n"
  - "`w{player}: `$\"Silver. ${price} more. Your {dRelation} survived {aFridge}, well, nearly. {dHeCap} deserves silver.\"\n\n"
  - "`w{player}: `$\"Wood is what the silver caskets are shipped in. ${price} more and {dFirst} gets the casket instead of the crate.\"\n\n"
  - "`w{player}: `$\"Termites have a word for a wood casket: lunch. Silver is ${price} more.\"\n\n"
  - "`w{player}: `$\"Wood is very traditional. So is dysentery. Silver, ${price} more.\"\n\n"
  - "`w{player}: `$\"I'd go wood myself, but I'm a terrible person. You're not, are you? Silver is ${price} more.\"\n\n"
  - "`w{player}: `$\"The wood model is fine if the plan is to dig {dHim} back up for firewood. Silver is ${price} more.\"\n\n"
  - "`w{player}: `$\"Silver caskets don't creak when the pallbearers lift them. Wood ones say things. Rude things. ${price} more.\"\n\n"
  - "`w{player}: `$\"Our wood casket was put together by a man named Gary on his lunch break. Silver, ${price} more, was not Gary.\"\n\n"
  - "`w{player}: `$\"Silver is ${price} more, and it doesn't look like something Elijah sells at Di-Mart next to the lawn furniture.\"\n\n"
  - "`w{player}: `$\"When the {dFridge} got {dHim}, do you think {dHe} was hoping for wood next? Silver is ${price} more.\"\n\n"
  - "`w{player}: `$\"Wood floats, {cSir}. Deathville floods. Silver is ${price} more and it stays where you put it.\"\n\n"
  - "`w{player}: `$\"Silver has a lining. Wood has a smell. ${price} difference.\"\n\n"
  - "`w{player}: `$\"In the wood one there's a knot that looks exactly like Father Smyth. He's seen it. Silver is ${price} more.\"\n\n"
  - "`w{player}: `$\"Woodpeckers. That's all I'll say. Silver, ${price} more.\"\n\n"
  - "`w{player}: `$\"Wood is \"rustic\", which is the word we use for \"cheap\" when the family is in the room. Silver is ${price} more.\"\n\n"
  - "`w{player}: `$\"Silver comes with a twenty-year warranty against worms. Wood comes with worms. ${price} more.\"\n\n"
  - "`w{player}: `$\"The Blaine Funeral Home sells a lot of wood caskets. Do you want to be Blaine? Silver is ${price} more.\"\n\n"
  - "`w{player}: `$\"I put my own mother in wood. I still hear about it. Silver's ${price} more.\"\n\n"
hardPitchSilver:
  - "`w{player}: `$\"Silver is nice. Gold is nicer. Gold is ${price} nicer, specifically.\"\n\n"
  - "`w{player}: `$\"Gold doesn't tarnish, {cSir}. Neither will your reputation. ${price} more.\"\n\n"
  - "`w{player}: `$\"The gold model is what we bury bank presidents in. And now, for ${price} more, your {dRelation}.\"\n\n"
  - "`w{player}: `$\"Imagine the lid opening and everyone going 'ooh'. That's gold. Silver gets an 'oh'. ${price} more.\"\n\n"
  - "`w{player}: `$\"Your neighbors went gold. I'm just saying. ${price} more.\"\n\n"
  - "`w{player}: `$\"Silver is for people who came in second, {cSir}. Gold is ${price} more.\"\n\n"
  - "`w{player}: `$\"Gold-plated handles, gold-plated hinges, gold-plated everything. ${price} more and {dHe}'ll shine in the dark.\"\n\n"
  - "`w{player}: `$\"Silver is what you buy when you love someone a moderate amount. Gold is ${price} more.\"\n\n"
  - "`w{player}: `$\"Gold is the only casket the Mayor will be photographed next to. And he's at every funeral. ${price} more.\"\n\n"
  - "`w{player}: `$\"Mr. Yang says gold brings luck. Frankly, {dFirst} could use some. ${price} more.\"\n\n"
  - "`w{player}: `$\"A gold casket says \"{dFirst} made it.\" A silver casket says \"{dFirst} nearly made it.\" ${price} more.\"\n\n"
  - "`w{player}: `$\"The gold hinges don't squeak during the eulogy. Silver hinges do a sort of whistle. ${price} more.\"\n\n"
  - "`w{player}: `$\"Gold holds its value, {cSir}. Not that you'll be reselling it. Probably. ${price} more.\"\n\n"
  - "`w{player}: `$\"Raccoons can't get into gold. They've tried. We have the footage. ${price} more.\"\n\n"
  - "`w{player}: `$\"Silver tarnishes in this climate. In five years {dHe}'ll be in a gray box. Gold is ${price} more and gold forever.\"\n\n"
  - "`w{player}: `$\"Father Smyth blesses the gold ones a little longer. I've timed it. ${price} more.\"\n\n"
  - "`w{player}: `$\"The velvet in the gold model is so soft people have fallen asleep in it. Living people. ${price} more.\"\n\n"
  - "`w{player}: `$\"Think of gold as first class. It's a one-way trip, so you might as well. ${price} more.\"\n\n"
  - "`w{player}: `$\"Gold is what pharaohs got. {dFirst} wasn't a pharaoh, but {dHe} was {dSmashed} {aFridge}, which is nearly as rare. ${price} more.\"\n\n"
  - "`w{player}: `$\"Let me put it this way: nobody has ever asked to be dug up out of a gold casket. ${price} more.\"\n\n"
  - "`w{player}: `$\"The gold model has a brass plaque. Engrave anything you like. \"{dFirst}: Worth It.\" ${price} more.\"\n\n"
  - "`w{player}: `$\"People in Blaine talk about our gold casket. People in Blaine never talk about anything of ours. ${price} more.\"\n\n"
  - "`w{player}: `$\"Look, you're already at silver. You can see gold from here. It's right there. ${price} more.\"\n\n"
  - "`w{player}: `$\"Gold doesn't rust, doesn't rot and doesn't judge. Silver judges a little. ${price} more.\"\n\n"
guiltPitch:
  - "`w{player}: `$\"{dFirst} would have done anything for you. And you're thinking about saving a few bucks?\"\n\n"
  - "`w{player}: `$\"I'm sure {dHe} would understand you going cheap. {dHeCap}'s dead, so {dHe} has to understand.\"\n\n"
  - "`w{player}: `$\"People at the wake will look in that casket, {cSir}, and then they'll look at you.\"\n\n"
  - "`w{player}: `$\"I'm not saying you're cheap. The other families are saying it. I'm just repeating it.\"\n\n"
  - "`w{player}: `$\"Some folks spend more on their cars than on their {dRelation}. You're not one of those folks, are you?\"\n\n"
  - "`w{player}: `$\"{dFirst} is watching from somewhere, {cSir}. Maybe heaven. Maybe the other place. But watching.\"\n\n"
  - "`w{player}: `$\"What will you tell people? '{dFirst} got the discount box'?\"\n\n"
  - "`w{player}: `$\"You only bury your {dRelation} once. Usually.\"\n\n"
  - "`w{player}: `$\"This is the last gift you'll ever give {dHim}. Make it count. Make it expensive.\"\n\n"
  - "`w{player}: `$\"I had a family in here last week who went cheap. They don't sleep anymore.\"\n\n"
  - "`w{player}: `$\"You can't take it with you. Neither can {dFirst}, but {dHe} can take it into the ground.\"\n\n"
  - "`w{player}: `$\"Did {dFirst} ever go cheap on you? Don't answer, I can see it in your face.\"\n\n"
  - "`w{player}: `$\"The Bible says something about this. I forget what. Something about spending.\"\n\n"
  - "`w{player}: `$\"Cheap funerals attract ghosts, {cSir}. It's a well-known fact I just made up.\"\n\n"
  - "`w{player}: `$\"I can see you loved {dHim}. I can also see your shoes. You can afford more.\"\n\n"
  - "`w{player}: `$\"You know who goes cheap on a funeral? People left out of the will. Were you left out of the will, {cSir}?\"\n\n"
  - "`w{player}: `$\"I'm just going to write down what you spend. No reason. For the record. For when people ask.\"\n\n"
  - "`w{player}: `$\"The {surname} family has a reputation in this town. I'd hate for the reputation to be \"thrifty\".\"\n\n"
  - "`w{player}: `$\"Imagine {dFirst} looking down right now. Now imagine {dHim} seeing the price tag. Now imagine {dHim} seeing YOUR face.\"\n\n"
  - "`w{player}: `$\"Funny thing about guilt, {cSir}. It doesn't go in the casket. It goes home with you.\"\n\n"
  - "`w{player}: `$\"In twenty years nobody will remember what you paid. They'll remember what you didn't.\"\n\n"
  - "`w{player}: `$\"My grandmother used to say you can tell how much someone was loved by the handles. These are not great handles.\"\n\n"
  - "`w{player}: `$\"The other mourners will be at the reception doing math. Out loud. About you.\"\n\n"
  - "`w{player}: `$\"I'm not here to judge. Father Smyth is. He's at every service. He takes notes.\"\n\n"
sympathyPitch:
  - "`w{player}: `$\"Take all the time you need. The meter isn't running. Well, it is, but slowly.\"\n\n"
  - "`w{player}: `$\"Tell me about {dFirst}. What was {dHe} like before the {dFridge}?\"\n\n"
  - "`w{player}: `$\"I lost my {dRelation} once. To {aFridge}, as it happens. Small world.\"\n\n"
  - "`w{player}: `$\"Here, have a tissue. Have the whole box. It's on the house. The box isn't, but the tissue is.\"\n\n"
  - "`w{player}: `$\"Grief is just love with nowhere to go, {cSir}. I read that on a mug.\"\n\n"
  - "`w{player}: `$\"You're doing great. Really. Most people throw things at this point.\"\n\n"
  - "`w{player}: `$\"{dFirst} sounds like a wonderful {dRelation}. I can tell from the paperwork.\"\n\n"
  - "`w{player}: `$\"It's okay to cry. Over there, though. Not on the brochures.\"\n\n"
  - "`w{player}: `$\"I'm here for you. Professionally. Within business hours.\"\n\n"
  - "`w{player}: `$\"You know, {dHe} isn't really gone. {dHeCap}'s in the back, actually. But spiritually, too.\"\n\n"
  - "`w{player}: `$\"Let it out. Nobody judges in here. Except the guy across the street. He judges.\"\n\n"
  - "`w{player}: `$\"What's your favorite memory of {dFirst}? Take your time. Not too much time.\"\n\n"
  - "`w{player}: `$\"The first week is the hardest. Then it's the second week. Then the paperwork.\"\n\n"
  - "`w{player}: `$\"You have my deepest sympathies, {cSir}. And my second-deepest, at a discount.\"\n\n"
  - "`w{player}: `$\"I'm going to put on some soft music. It's the hold music, but it's soft.\"\n\n"
  - "`w{player}: `$\"I can only imagine. Well, I don't have to imagine, I have the paperwork. But I'm imagining too.\"\n\n"
  - "`w{player}: `$\"Let's take a moment for {dFirst}. ... There. That was a moment. How do you feel?\"\n\n"
  - "`w{player}: `$\"When my goldfish died I didn't get out of bed for a week. And that was a fish. This is {dFirst}.\"\n\n"
  - "`w{player}: `$\"Death is a natural part of life. So, apparently, is {aFridge}. I'm so sorry.\"\n\n"
  - "`w{player}: `$\"You don't have to be strong in here, {cSir}. The walls are soundproof. We had them done for the embalming.\"\n\n"
  - "`w{player}: `$\"Here, hold Morty's hand. He's our skeleton. He's a very good listener and he's been through worse.\"\n\n"
  - "`w{player}: `$\"{dFirst} was lucky to have you. I can tell. You're the kind of person who reads the fine print and still cries.\"\n\n"
  - "`w{player}: `$\"Tell me something {dFirst} used to say. Anything. Something stupid is fine. Those are the best ones.\"\n\n"
coffeePitch:
  - "`w{player}: `$\"Can I get you a coffee? It's fresh. Fresher than most things in this building.\"\n\n"
  - "`w{player}: `$\"Coffee? Cream? Sugar? Something stronger in a coffee cup?\"\n\n"
  - "`w{player}: `$\"Let's take a breather. I'll get the pot.\"\n\n"
  - "`w{player}: `$\"Here, have a cup. Mind the mug, it says 'World's Best Mortician', I bought it myself.\"\n\n"
  - "`w{player}: `$\"You look like you could use a coffee. Or a nap. I can only offer one of those.\"\n\n"
  - "`w{player}: `$\"Coffee is on the house. The house is a funeral home, so drink it quick.\"\n\n"
  - "`w{player}: `$\"Sit, sit. I'll pour. Don't mind the smell, that's not the coffee.\"\n\n"
  - "`w{player}: `$\"A hot cup of joe makes everything better. Not this, but other things.\"\n\n"
  - "`w{player}: `$\"Decaf or regular? I'll be honest, they come out of the same pot.\"\n\n"
