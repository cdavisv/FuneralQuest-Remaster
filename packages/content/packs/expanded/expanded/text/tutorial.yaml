start: 'Meet Your Customer'
hints:
  arrival: 'Clerk: Read the mood word and what they say. Then open Soft Sell and pick something under the top of the estimate.'
  hand: 'Clerk: Pick the card that brings the bill closest to their limit without going over.'
  packages: 'Clerk: Each card upgrades one part of the funeral by one step. Mind the price.'
  afterPitch: 'Clerk: Watch the mood and the patience. When the bill is near the top of the estimate, press Done.'
  impatient: 'Clerk: They''re out of patience! Everything you do now makes them angrier. Wrap it up.'
  done: 'Clerk: Not bad at all. Press Continue. I''m writing ''not bad at all'' in my little book.'
finish: '`wClerk: `$"Not bad for a first day! Wait for customers until your turns run out, then see the town: Di-Mart for caskets, your office for upgrades, Spirit University if you''d like to read minds. Good luck. Try not to get stabbed."'
