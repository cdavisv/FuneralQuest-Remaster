# The Police Station, Crematorium, Florist and Town Gazette (docs/expanded-rules.md section 30):
# their people, pictures, hints and every line of text (ExpandedContent.placesA, core townPlacesA.ts).
# The numbers are in rules.town.placesA. Legacy colour codes and {placeholders}; amounts arrive already
# formatted as "$1,000", so never put a dollar sign next to {price}, {fine}, {money} or {amount}.

cast:
  sergeant: 'Sergeant Bixby'
  ovenKeeper: 'Old Cinder Pete'
  florist: 'Marigold Thorne'
  editor: 'Hal Pennywhistle'
pictures:
  police:
    fg: 'people/sergeant-bixby'
    bg: 'places/funeral_enemy_police'
  crematorium:
    bg: 'places/creamation_oven'
  florist:
    fg: 'people/marigold-thorne'
    bg: 'places/florist'
  gazette:
    fg: 'people/hal-pennywhistle'
    bg: 'places/gazette'
hints:
  notEnoughCash: 'You can''t afford that.'
  doneToday: 'Already done today.'
  alreadyHave: 'You already have it.'
  noRivals: 'There is nobody to pick.'
saleNotes:
  oven: '

    `$Your rented oven slot saves you `w{money}`$ on the cremation.'
  flowers: '

    `$Fresh bouquets from the florist ({count}) add `w{money}`$.'
police:
  title: 'Police Station'
  note: 'Deathville''s finest. Mostly they are finest at doughnuts.'
  intro: '`w{inspector}: `$"Break-in? Assault? Lost cat? Pick one, sign here, and try not to lean on the desk. It is the only desk we have."'
  introPatrolled: '


    `$A patrol car idles at the curb, pointed at your parlor. It is on your tab.'
  introAhead: '


    `w{inspector}: `$"A parlor doing as well as yours draws a crowd, and a crowd is overtime. Tonight the car is `w{extra}`$ over the usual."'
  buttons:
    report: 'File a Report'
    settle: 'Take a Settlement'
    patrol: 'Hire a Patrol'
    backdoor: 'The Back Door'
    leave: 'Leave'
  reportPrompt: '`w{inspector}: `$"Who broke in on you? Pick a name and I will write it down."'
  settlePrompt: '`w{inspector}: `$"You want the money, not the paperwork? Name the culprit."'
  noGrievances: 'Nobody has hit your parlor lately.'
  alreadyPatrolled: 'Tonight is already covered.'
  peacefulSafe: 'Peaceful parlors are off the rota already.'
  reported: '`$The report is filed. {name} is fined `w{fine}`$ and the town pays you `w{share}`$ for the trouble. Your name is on the right side of a form for once.'
  reportedBroke: '`$The report is filed. {name} has nothing worth fining, so the form goes in a drawer, but you feel better.'
  settled: '`$You and {name} reach an understanding in the parking lot. They hand over `w{amount}`$ and the form is never filed.'
  settledBroke: '`$You and {name} reach an understanding. They hand over lint and the form is never filed.'
  fineMail: '`$The police fined you `4{fine}`$ for roughing up {name}''s parlor. The officer said it with a straight face.

    '
  settleMail: '`$You were cornered by {name} about the break-in. To keep it off the record you paid `4{amount}`$.

    '
  fineNews: "`$Police fined {name} `w{fine}`$ after a complaint about a break-in.\r\n"
  patrolBought: '`w{inspector}: `$"One patrol car, parked outside all night. Nobody gets in, nobody gets out, nobody asks."'
  backdoorWorked: '`w{inspector}: `$"Funny, I never saw an envelope. A car will be outside tonight. I will not remember why."'
  backdoorFailed: '`w{inspector}: `$"That envelope was for the fund. The fund thanks you. No car, and I would not call a lawyer."'
  grievanceRow: '{rival} (day {day})'
crematorium:
  title: 'Crematorium'
  note: 'The oven runs hot and the owner runs hotter.'
  intro: '`w{keeper}: `$"Oven time by the slot, no questions, no inspections. You have `w{slots}`$ slots reserved until day `w{until}`$ and `w{ashes}`$ urns on the shelf."'
  introNone: '`w{keeper}: `$"Oven time by the slot, no questions, no inspections. You have no slots reserved and `w{ashes}`$ urns on the shelf."'
  permitNote: '

    `$The crematory permit on your wall knocks the price down.'
  buttons:
    rent: 'Rent Oven Time'
    bulk: 'Rent a Week''s Worth'
    scatter: 'Scatter the Ashes'
    diamonds: 'Press the Ashes'
    leave: 'Leave'
  ovenFull: 'The oven rack is full.'
  noAshes: 'No urns are waiting.'
  rented: '`w{keeper}: `$"Slot reserved. That makes {slots} on your tab. Bring me a body and a bad attitude."'
  bulkBought: '`w{keeper}: `$"Bulk rate. Nobody ever bought in bulk and complained. That makes {slots} slots."'
  scattered: '`$You take {count} urn(s) to the lake at dawn and let the wind do the talking. It is very quiet. The town thinks better of you.'
  pressed: '`$Urns pressed: {count}. They go into the press behind the shed. A jeweler with no questions pays `w{money}`$. You try not to look at the display case again.'
florist:
  title: 'Florist'
  note: 'Roses are red, violets are blue, that is a lot of stems for a funeral or two.'
  intro: '`w{florist}: `$"Fresh stems for your funeral packages. You have `w{stock}`$ in the cooler. {special}"'
  buttons:
    buy: 'Buy a Bouquet'
    bundle: 'Buy a Bundle'
    church: 'Wreath for Father Smyth'
    ward: 'Flowers for the Ward'
    leave: 'Leave'
  special:
    clear: 'Nothing special today. Roses are on the shelf.'
    rain: 'It is raining, so lilies are in season and cheaper.'
    fog: 'The fog hurts the deliveries, but not the prices.'
    storm: 'The storm smashed the front window, so everything is on clearance.'
    heat: 'It is hot, and flowers in the heat cost extra to keep alive.'
    snow: 'The snow shut the growers, so hothouse stems cost extra.'
  specialNone: 'The price is whatever it is today.'
  shelfFull: 'Your cooler is full.'
  bought: '`w{florist}: `$"{count} bouquet(s) added to your cooler. Sell them before they wilt."'
  wreathDone: 'Already sent flowers today.'
  wardSent: '`$A hundred stems go to {nurse}''s ward. A patient cries. A visitor steals a rose. Everyone is a bit luckier.'
  churchSent: '`$A large wreath goes to Father Smyth''s pulpit. He mentions your name in the sermon, which is the best thing he has ever said about anyone.'
gazette:
  title: 'Town Gazette'
  note: 'All the news that is fit to print, and some that is not.'
  intro: '`w{editor}: `$"The Gazette goes everywhere in Deathville that {mayor} goes, which is a surprising amount of places. Ad copy, a feature on you, or a hatchet job on somebody else. What can I do?"'
  buttons:
    classified: 'Run a Classified'
    display: 'Buy a Display Ad'
    puff: 'Front-Page Puff Piece'
    smear: 'Run a Smear'
    leave: 'Leave'
  adBooked: 'You already booked an ad today.'
  puffDone: 'You already own the front page today.'
  smearDone: 'The Gazette has printed one smear for you today.'
  classifiedBooked: '`w{editor}: `$"Three lines in the back, between a missing cat and a pie sale. People will read it tomorrow. Some of them."'
  classifiedFlop: '`w{editor}: `$"Three lines in the back, between a missing cat and a pie sale. Nobody will read it. Nobody ever does."'
  displayBooked: '`w{editor}: `$"Half a page, with a border. Tomorrow the whole town sees your name, and your phone number."'
  adMorning: '

    `$Somebody read the Gazette ad: {count} new customer(s) waiting for you.'
  puffPrinted: '`w{editor}: `$"Front page, above the fold, your face six columns wide. Try to look like you deserve it."'
  puffNews: "`w{name}: `$A beloved parlor. The Gazette says {name} is a pillar of the community, and not a single pillar was asked.\r\n"
  smearPrompt: '`w{editor}: `$"A smear costs {price}. Who is the unlucky one? I will find the adjectives."'
  smearDone2: '`w{editor}: `$"Done. {name} will read about themselves in the morning. I took the liberty of spelling their name right."'
  smearNews: "`$The Gazette hears rumors about {name}'s parlor. Nobody will say what the rumors are. They are, however, everywhere.\r\n"
  smearMail: '`$The Gazette printed rumors about your parlor. Your word of mouth took a hit. Somebody paid for that.

    '
  smearBackfire: '`w{editor}: `$"{name} has a lawyer, an alibi and a nephew in the print room. The piece is pulled, you are fined `w{fine}`$, and I never met you."'
  smearBackfireNews: "`$The Gazette retracts its piece on {target}, after a complaint. It will not say who paid for the first one, and the whole town knows it was {name}.\r\n"
  smearBackfireMail: '`$Word is {name} tried to smear you in the Gazette. The piece was pulled and your good name is clean.

    '
  smearPeaceful: '{name} is a Peaceful parlor and off limits to the Gazette.'
  smearChain: '{name} is in your chain. Run it past them first.'
