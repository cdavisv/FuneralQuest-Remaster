        karma: 1
        reviews: -1
- id: 'grin'
  picture: 'places/prep-cosmetics'
  text: '`$Rigor mortis has left {dFirst} with an enormous grin, like {dHe} just heard a filthy joke.'
  options:
    - label: 'Leave the Grin'
      text: '`$At the viewing everyone agrees {dFirst} looks happier than {dHe} ever did alive. One aunt faints. It''s taken as a good omen.'
      effects:
        luck: 5
        reviews: -1
    - label: 'Staple Gun'
      text: '`$Two staples and a firm hand. {dFirst} looks dignified, and only slightly surprised.'
      effects:
        karma: 1
        reviews: 1
      risk:
        weight: 0.9
        failText: '`$During the viewing a staple gives out with an audible ping. The grin returns. So does the aunt, to faint again.'
        failEffects:
          reviews: -3
- id: 'glass-eye'
  text: '`${dFirst}''s glass eye pops out and rolls under the embalming table. When you find it, it is looking right at you.'
  picture: 'people/m_doctor'
  options:
    - label: 'Put It Back'
      text: '`$You pop it back in, a little crooked. All through the viewing {dFirst} appears to be winking at the widows.'
      effects:
        luck: 2
        reviews: -1
    - label: 'Sell It to Cousin Sal'
      text: '`$Sal pays fifty bucks and says he has "a patient" who needs it. You decide not to ask which way it will face.'
      effects:
        money: 50
        karma: -1
      evil: true
    - label: 'Give It to Morty'
      text: '`$Morty the skeleton finally has an eye. One. He seems more confident already.'
      effects:
        luck: 3
        karma: -1
- id: 'coins'
  text: '`$Someone has laid two silver dollars on {dFirst}''s eyes, the old way. You turn one over. 1921. Collector''s coins.'
  picture: 'stuff/money_bag'
  options:
    - label: 'Leave Them'
      text: '`$Ferry fare for the far side. You''d hate for {dFirst} to have to swim.'
      effects:
        karma: 1
    - label: 'Swap In Quarters'
      text: '`$Inflation hits the afterlife hard. The coin shop on Main pays well and asks nothing.'
      effects:
        money: 150
        karma: -2
      risk:
        weight: 0.85
        failText: '`$The grandson leans in to say goodbye and loudly asks why Grandpa''s eyes say "Delaware".'
        failEffects:
          karma: -2
          reviews: -3
      evil: true
