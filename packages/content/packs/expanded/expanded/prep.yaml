- id: 'tape'
  picture: 'places/prep-table'
  text: '`${dFirst} left a cassette labelled PLAY AT MY FUNERAL. You play a bit of it in the back room. It is forty minutes of grudges, by name.'
  options:
    - label: 'Play It All'
      text: '`$The Mayor is mentioned eleven times. The cafe talks about nothing else for a month.'
      effects:
        reviews: 3
        luck: -2
    - label: 'Play the Nice Parts'
      text: '`$That takes nine seconds. You loop it twice. The family is very moved.'
      effects:
        karma: 1
        reviews: 1
