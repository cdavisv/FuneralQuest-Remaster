loved:
  - '{customerName} keeps touching a photo of {dFirst} like it might still be warm.'
  - '{customer}"{dHeCap} made the worst coffee in the world. I''d give anything for one more cup."'
  - '{customerName}''s mascara has given up entirely.'
  - '{customer}"I keep setting two plates at dinner."'
  - '{customerName} is wearing {dFirst}''s old cardigan. It''s three sizes too big.'
  - '{customer}"I still have {dHis} voicemail saved. I play it in the car. It''s just {dHim} asking where the remote is."'
  - '{customerName} has to stop twice while saying {dFirst}''s name.'
  - '{customer}"Everybody keeps saying it gets easier. When? Give me a date."'
  - '{customerName} is holding {dFirst}''s house keys and won''t put them down.'
  - '{customer}"{dHeCap} always knew what to say. I''ve been standing in the kitchen for two days waiting for {dHim} to say it."'
  - '{customerName} apologises to the chair after bumping into it, then starts crying again.'
  - '{customer}"I went to call {dHim} about it. To tell {dHim} {dHe} died. I had the phone in my hand."'
  - '{customerName} carefully straightens {dFirst}''s photo on your desk. It was already straight.'
  - '{customer}"Can {dHe} have {dHis} reading glasses? {dHeCap} hated not being able to see."'
  - '{customerName} hasn''t slept. It''s written all over {cHis} face, along with a lot of smeared eyeliner.'
  - '{customer}"I found {dHis} grocery list. Milk, eggs, call {cFirst}. I''m {cFirst}."'
  - '{customerName} smiles at something only {cHe} remembers, then stops smiling.'
notLoved:
  - '{customerName} checks {cHis} phone. Twice. While you''re talking.'
  - '{customer}"How long does this usually take? The will is being read at four."'
  - '{customerName} hasn''t once said {dFirst}''s name.'
  - '{customer}"Can we skip the part where I pretend to be sad?"'
  - '{customerName} asks if you validate parking before asking anything about the funeral.'
  - '{customer}"{dFirst}? Yeah. That was the name. Is there a form?"'
  - '{customerName} yawns, then covers it with a fake sob that fools nobody.'
  - '{customer}"Honestly I''m only here because the rest of the family voted and I lost."'
  - '{customerName} calls {dFirst} "the deceased" every single time, like a cop on TV.'
  - '{customer}"I brought a black tie. It''s a clip-on. That''s about my level of grief."'
  - '{customerName} is humming. Quietly, but definitely humming.'
  - '{customer}"Do I have to come to the viewing, or can I just send flowers? Cheap flowers?"'
  - '{customerName} has already measured {dFirst}''s living room for a pool table.'
  - '{customer}"We weren''t close. We weren''t anything. We were people who shared a Thanksgiving once."'
  - '{customerName} glances at the clock on your wall, then at {cHis} watch, to check the clock.'
  - '{customer}"Is it bad that I''m a little relieved? Don''t answer that. It''s not bad."'
cheapLow:
  - '{customerName} tips the umbrella stand a dollar.'
  - '{customer}"I don''t care what it costs. Well. I care a little."'
  - '{customerName} is wearing a watch that costs more than your hearse.'
  - '{customer}"Whatever''s nicest. I''m not going to stand here and squint at numbers."'
  - '{customerName} hasn''t looked at a single price tag. You''ve been watching.'
  - '{customer}"If it''s on the list, assume yes. Unless it''s stupid. Assume yes anyway."'
  - '{customerName} pays for the parking meter outside for the whole day, just in case.'
  - '{customer}"Life''s short. {dFirst}''s was. Let''s not be cheap about it."'
  - '{customerName} asks whether the brochure comes in a leather edition.'
  - '{customer}"I''ve never once asked for a discount in my life. I think it''s tacky."'
  - '{customerName} lets you pick the coffee mug. Doesn''t ask what anything costs, including the coffee.'
  - '{customer}"Money''s for spending. That''s what {dFirst} always said, and then {dHe} spent all of {dHis}."'
  - '{customerName} brought a checkbook and a fancy pen and seems eager to use both.'
  - '{customer}"Don''t show me the cheap stuff. I''ll feel bad for the cheap stuff."'
  - '{customerName} has the relaxed shoulders of someone who never balances a checkbook.'
cheapMid:
  - '{customerName} squints at the price list but doesn''t flinch.'
  - '{customer}"I want it done right. Within reason. Whatever reason is."'
  - '{customerName} asks if the coffee is free, then drinks it either way.'
  - '{customer}"I''m not made of money, but I''m not made of cardboard either."'
  - '{customerName} reads the prices, nods slowly, and reads them again.'
  - '{customer}"Nice is fine. Fancy, we''ll see."'
  - '{customerName} does a little math on a napkin, then puts the napkin away.'
  - '{customer}"I''ve got a number in my head. I''m not telling you the number."'
  - '{customerName} winces at the gold casket, then shrugs at the silver.'
  - '{customer}"Some extras would be okay. Some. Let''s not go crazy."'
  - '{customerName} asks what most people get, the way people do when they want to get exactly that.'
  - '{customer}"I''ll pay for what makes sense. Convince me it makes sense."'
  - '{customerName} keeps one hand on {cHis} wallet, but loosely.'
  - '{customer}"I''m happy to spend. I''m not happy to be stupid about it."'
  - '{customerName} bargains over the brochure fee, then laughs when you say there isn''t one.'
cheapHigh:
  - '{customerName} asks if you take expired coupons.'
  - '{customer}"My cousin says I could just use a refrigerator box."'
  - '{customerName} has brought {cHis} own folding chair so you can''t charge for seating.'
  - '{customer}"Is the hearse extra? Can I drive {dHim} in my pickup? I''ve got a tarp."'
  - '{customerName} asks if the funeral is cheaper on a weekday. Or at night. Or in the rain.'
  - '{customer}"What''s the cheapest thing you have? No, cheaper. No, CHEAPER."'
  - '{customerName} pockets three of your complimentary mints, then a fourth for later.'
  - '{customer}"Do you price-match? The guy in Blaine said he''d do it for a case of beer."'
  - '{customerName} counts the tissues you hand {cHim} and gives two back.'
  - '{customer}"Does it have to be a casket? What''s the rule? Who made the rule?"'
  - '{customerName} asks whether the plot comes with a refund if {dFirst} turns out to be alive.'
  - '{customer}"We could just do the funeral in the backyard. People do that. I''ve read about it."'
  - '{customerName} has a calculator watch and is not afraid to use it.'
  - '{customer}"I''m not cheap. I''m thrifty. Thrifty people live longer. Ask {dFirst}. Actually, don''t."'
  - '{customerName} takes the free pen. Then the pen holder.'
limitHigh:
  - '{customer}"Good news is there was a life insurance policy. Bad news is the ferret was the beneficiary. I''m the ferret''s guardian."'
  - '{customerName} mentions, three times, the boat {cHe} just bought.'
  - '{customer}"The settlement from the {dFridge} company came through, if that matters."'
  - '{customerName} paid for the parking with a hundred and told the meter to keep the change.'
  - '{customer}"{dFirst} left a little something. A big little something. Several little somethings."'
  - '{customerName}''s wallet is so fat it won''t fold. It''s more of a wallet brick.'
  - '{customer}"The bank called. The account is bigger than any of us thought. We''re all being very polite to each other now."'
  - '{customerName} arrived in a car so new it still has the sticker on the window.'
  - '{customer}"I sold {dHis} coin collection this morning. Turns out one of them was the good kind."'
  - '{customerName} keeps getting calls from an accountant and letting them go to voicemail, smiling.'
  - '{customer}"Work gave me a bonus this year. It was supposed to be a hot tub. It''s going to be {dFirst}."'
  - '{customerName} has a gold card, a platinum card, and a card you''ve never even heard of.'
  - '{customer}"{dFirst} was a saver. A big saver. Under the mattress, in the freezer, inside the dog."'
  - '{customerName} asks whether you take wire transfers, like {cHe} does it a lot.'
  - '{customer}"The {dFridge} people''s lawyers are very, very sorry. About this sorry." {customerName} holds {cHis} hands wide.'
limitLow:
  - '{customer}"Money''s tight. The {dFridge} wasn''t insured."'
  - '{customerName} pays for the parking meter in nickels.'
  - '{customer}"I had to sell {dHis} bowling ball to get here."'
  - '{customerName}''s shoes have been resoled more times than {cHe}''s been to church.'
  - '{customer}"Payday''s not till the fifteenth. {dFirst} picked a lousy week."'
  - '{customerName} asks if you take payment plans. Long ones. Possibly multi-generational ones.'
  - '{customer}"There was supposed to be insurance. There was supposed to be a lot of things."'
  - '{customerName}''s car is idling outside because it might not start again.'
  - '{customer}"I passed the hat at work. It came back with forty dollars and a button."'
  - '{customerName} keeps {cHis} hand over a hole in {cHis} only good jacket.'
  - '{customer}"The bank froze {dHis} account. I''m working with what''s in the coffee can."'
  - '{customerName} brought a jar of loose change and is very protective of it.'
  - '{customer}"Rent''s due Friday. {dFirst} would want me to pay rent. Probably."'
  - '{customerName} asks if the free mints are free, then takes one and saves it.'
  - '{customer}"{dFirst} left me everything. Everything turns out to be a recliner and some debt."'
