title: 'The Reaper Club'
note: 'You shiver as you approach the Reaper, a rave club frequented by the underbelly of society (mostly funeral directors).'
door: '`$The bouncer, a man with a neck like a tree stump, holds out a hand. You count six fingers. "Cover''s `w{cover} wooden tags`$." Behind him {owner} waves from the VIP booth.'
necroFree: '`$The bouncer sees the grave dirt under your nails, nods with respect and waves you straight through.'
inside:
  - '`$You can barely hear yourself think. Somebody is dancing with a skeleton, and the skeleton is leading.'
  - '`$The DJ is playing organ music with a dance beat. Three morticians are doing the conga around a casket.'
  - '`$The bartender pours you something green. It''s either absinthe or embalming fluid. Here, there''s no difference.'
  - '`$A fog machine hisses in the corner. Through the fog you make out three morticians, a priest and Cousin Sal sharing a hookah.'
  - '`$The dance floor is an old embalming table lit from underneath. Nobody asks where they got it. You know where they got it.'
  - '`$Lucius Vane holds court in the VIP booth, which is a hearse with the back taken off. He raises a glass of something red at you.'
  - '`$Somebody spiked the punch bowl with formaldehyde. The punch is now technically preserved, and so is the guy face down in it.'
  - '`$A mortician in a cape screams "ASHES TO ASHES" into the microphone. The whole room screams back "DUST TO DUST."'
  - '`$The Twins are at the bar, drinking one drink through two straws, staring at you without blinking.'
buttons:
  pay: 'Pay the Cover'
  games: 'The Back Tables'
  market: 'Black Market'
  hit: 'Hire a Hit Man'
  bodyguard: 'Hire a Bodyguard'
  seance: 'Seance in the Back Room'
  draw: 'Draw'
  slots: 'Slots'
  shots: 'Shots'
  leave: 'Leave'
  back: 'Back'
gamesIntro: '`$The house games, as honest as anything else in this town, so hold on to your wallet. You''ve staked `w${staked}`$ tonight; the house stops you at `w${max}`$. Over a night the house always comes out ahead. That''s what makes it the house.

  `wDead Man''s Draw`$: you and the Reaper each draw a card; high card wins even money, a tie and the Reaper keeps half.

  `wThe One-Armed Undertaker`$: three skulls pay 500 to one, three coffins 100, three bones 30, three roses 12, three worms 4; a skull on the first reel gets your stake back.'
stakeLabel: '${stake}'
drawWin: '`$You draw the `w{you}`$, the Reaper draws the `w{dealer}`$. You win `w${won}`$! The Reaper shuffles slowly, like he''ll remember this.'
drawLose: '`$You draw the `w{you}`$, the Reaper draws the `w{dealer}`$. A bony hand rakes in your `w${won}`$. You can hear him smiling.'
drawTie: '`$You both draw the `w{you}`$. The Reaper keeps `w${won}`$ for his trouble. He calls it a handling fee.'
cards:
  - 'Two'
  - 'Three'
  - 'Four'
