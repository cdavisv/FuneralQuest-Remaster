  - 'Jack'
  - 'Queen'
  - 'King'
  - 'Ace'
slotsSpin: '`$The One-Armed Undertaker clanks and groans: `w{reels}`$. '
slotsWin: '`$It coughs up `w${won}`$! A small crowd gathers to watch you count it, then to ask for a loan.'
slotsLose: '`$Nothing. The machine burps, and the skull on the front laughs at you.'
symbols:
  skull: 'SKULL'
  coffin: 'COFFIN'
  bone: 'BONE'
  rose: 'ROSE'
  worm: 'WORM'
shotsIntro: '`wFormaldehyde Roulette`$: six shot glasses, and one of them isn''t vodka. Drink one and live, and the house pays a little under a fifth of your stake. Pick wrong and you lose it, and your liver files a complaint.'
shotsWin: '`$You slam it back. Vodka! The crowd cheers and the house pays `w${won}`$. Your hands are shaking. That''s normal.'
shotsLose: '`4That was not vodka. You lose your stake, a good deal of your dignity and one eyebrow.`$'
marketIntro: '`$A man in a trench coat opens it. The inside is lined with merchandise. "Today''s specials. Cash only. No receipts, no faces, no refunds."


  '
marketLine: '`w{name}`$, `w${price}`$: {text}

  '
marketBought: '`$You buy `w{name}`$. When you look up, the man in the trench coat is gone, and so is your pen.'
hitPrompt: 'Whose knees need a talking-to? (from ${price}, more for bigger parlors)'
hitBooked: '`$Lucius Vane takes the envelope and doesn''t count it, which is worse. "Tonight. {name} won''t know what hit them. Well. They''ll know it was a tire iron." `5(-5 karma)`$'
hitSelf: '`$Vane looks at you for a long time. "Get help, pal. Real help. Not the kind I sell."'
hitPeaceful: '`${name} took the Peace Pledge. Even Vane has rules, and that''s one of the two.'
hitTaken: '`$Somebody already paid for {name} tonight. Vane doesn''t double-book. It''s bad for the knees.'
hitChain: '`${name} is in your chain. Vane doesn''t do family. He has a mother.'
hitNews: '`7MORTICIAN ROUGHED UP

  `^{name} was found in a dumpster behind Bill''s Big Burger last night, alive, with a very clear memory of a tire iron. Police have no leads and no interest.


  '
hitMail: '`4Two men visited you last night and had a frank talk with you, using a tire iron for emphasis. You lose `5{bp} BP`4.`$'
hitFoiledMail: '`$Two men with a tire iron came to your parlor last night, took one look and left. You''ll never know why. Maybe it was the dog.'
hitFoiledHirer: '`$Vane sends word: the job on `w{name}`$ didn''t come off. No refunds. He sends a mint, though.'
hitSnitchMail: '`$The thug who came for you last night was picked up by the police and sang like a choir. `w{name}`$ paid him.'
hitSnitchNews: '`7HIT MAN SINGS

  `^A hired thug arrested outside {target}''s parlor told police that {name} paid for the job, then asked for a lawyer and a sandwich. {name} has been fined, and Father Smyth has been told.


  '
hitRumour: '`$Word at the Reaper Club is that somebody paid for your knees tonight. You might want a bodyguard, or a vest, or a long weekend in Blaine.'
bodyguardBought: '`$A man the size of a hearse will sleep on your porch tonight. He brought his own blanket and a teddy bear named Knuckles.'
seanceWin: '`$The candles gutter and the curtains stir. The dead whisper two names and two addresses, and that both will be needing you soon. `5(+2 customer leads)`$'
seanceFail: '`4The dead have nothing to say to you, and one of them is rude about it, at length. `5(-3 luck)`4`$'
