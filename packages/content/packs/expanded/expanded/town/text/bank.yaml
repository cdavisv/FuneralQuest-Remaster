savingsIntro: '`$Prudence the teller looks at you over her glasses. You have `w${savings}`$ in savings, earning `w{rate}%`$ a day (on up to `w${cap}`$). Cash on hand: `w${cash}`$. Money in the bank can''t be stolen from your till, she points out, slowly.'
depositPrompt: 'How much do you want to deposit?'
withdrawPrompt: 'How much do you want to withdraw?'
deposited: '`$Prudence counts your `w${money}`$ twice, licks her thumb, counts it a third time and stamps the book.'
withdrew: '`$Prudence hands over `w${money}`$ one bill at a time, as if saying goodbye to each of them.'
badAmount: '`$Prudence stares at you over her glasses until you go away and come back with a real number.'
noDepositWithLoan: 'Pay off your loan first'
loanIntro: '`$The bank will lend against your plots: up to `w${limit}`$ today, at `w{rate}%`$ interest a day (and `w{fee}%`$ up front, the first day''s, which Prudence calls a handling fee), due in `w{days}`$ days. If you don''t pay, they take your cash, your savings and your caskets, and Prudence tells the whole town. She enjoys that part.'
loanOwed: '`$You owe the bank `w${owed}`$, due at the end of day `w{due}`$. Prudence has circled it on her calendar, in red.'
borrowPrompt: 'How much do you want to borrow?'
borrowed: '`$The loan officer counts out `w${money}`$. "Due day {due}. We know where you bury people."'
repaid: '`$You pay the bank `w${money}`$. Prudence almost smiles. It passes.'
loanClosed: 'The bank stops lending this close to the end of the season'
deadbeat: 'The bank doesn''t lend to deadbeats'
loanCollected: '`$Your loan came due. The bank collected `w${money}`$ from your accounts, with a note: THANK YOU FOR NOT MAKING THIS DIFFICULT.'
loanDefault: '`4Your loan came due and you couldn''t cover it. The bank took everything it could and wrote off `w${left}`4. Your name is taped in the bank window under the word NO. `5(-{bp} BP)`4`$'
transferIntro: '`$You can send casket tags to another parlor. Prudence keeps `w{fee}%`$ (rounded up) of each transfer, for her trouble. You''ve sent `w{sent}`$ of `w{max}`$ wood-tag equivalents today; nobody can receive more than that a day either.'
transferPick: 'Who do you want to send tags to?'
transferTier: '`$Which tags do you want to send to `w{name}`$?'
transferCount: 'How many tags?'
transferred: '`$`w{count}`$ {tier} tag(s) are on their way to `w{name}`$. Prudence keeps `w{fee}`$ and files them under Mine.'
transferMail: '`w{name}`$ sent you `w{count}`$ {tier} tag(s) through the bank. There is no note. There is never a note.'
transferTooNew: 'New parlors can''t send tags for a few days'
transferLimit: 'That''s over the daily limit ({left} more)'
transferTheirLimit: 'They can''t receive any more today'
transferSelf: 'You can''t send tags to yourself'
transferNotEnough: 'Not enough tags for that (and the fee)'
