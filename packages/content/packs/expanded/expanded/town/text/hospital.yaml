title: 'Hospital'
note: 'The hospital smells of bleach and boiled carrots. The Nurse looks up from a crossword about bones, which she is winning.'
greeting: '`w{nurse}: `y"Back again, {player}? What did you break this time, prince? Don''t tell me. Show me. No, tell me."'
injuryLine: '`$`w{name}`$: heals in `w{days}`$ day(s), or `w${price}`$ to fix today.'
noInjuries: '`$You''re in one piece, more or less. Injuries from fights would show up here, and on your face.'
buttons:
  treat: 'Fix {name}'
  lead: 'Bribe the Nurse'
  leave: 'Leave'
treated: '`$The doctor fixes your `w{name}`$ and charges you for the tongue depressor, the lollipop and the look he gave you.'
leadIntro: '`$The Nurse knows who''s in intensive care and who won''t be leaving it. For `w${price}`$ she''ll put your card in the right hand. `5({karma} karma, a sure and richer customer)`$'
leadBought:
  - '`$The Nurse tucks the money in her shoe. "Room 212. Ask for the daughter."'
  - '`$"Bed six. Pancreas. Give it till Thursday." She winks. You wish she hadn''t.'
  - '`$She slides a menu across the desk with a name circled on the back. "He had the chowder, prince. Nobody survives the chowder."'
  - '`$"Third floor, the room with the balloons. The balloons are optimistic." The money disappears into her cardigan.'
  - '`$"Mrs. Teague in 14 wants a pink casket and won''t shut up about it. Bring a brochure." She pats your cheek.'
  - '`$"There''s a man in the cardiac ward who just read his bill." She crosses herself and counts your money.'
  - '`$"Wait till the priest comes out. Then go in looking sad, not hungry." She has clearly done this before.'
  - '`$She writes a room number on your hand in pen. "And wash that off before the family sees it, prince."'
  - '`$"The family in the waiting room has been fighting about the will for an hour. They''ll want it fast and fancy."'
leadMax: 'You already have plenty of leads'
stillHurt: '

  `4Still hurting: {list}.`$'
hurtTurns: '

  `4Your injuries slow you down: `w-{turns}`4 turn.`$'
newInjury: '`4Injury: {name}.`$'
armorSaved: '`$Your vest takes the worst of it. The vest is ruined. You are only bruised, and slightly embarrassed.'
leadArrives: '`$The family your lead promised walks in, wallet first, right on time. The Nurse is never wrong.'
