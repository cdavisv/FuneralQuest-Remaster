  title: 'ELM STREET REBUILDS IN ''FIRE-RESISTANT CARDBOARD'''
  message: 'The Twins'' insurers have funded a rebuild in materials that "should hold in light weather". Contractors have hung a banner reading UNDER NEW MANAGEMENT; the previous management is in Blaine. Hammers are scarce, and so are the walls they are for.'
