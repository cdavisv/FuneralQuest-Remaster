  title: '{mayor} BANS MONDAYS, SETTLES FOR LONGER FRIDAY'
  message: 'The order was withdrawn after a clerk pointed out that Mondays are load-bearing. Business owners are cautiously optimistic and have not been told which Friday. Several parlors have already booked it.'
