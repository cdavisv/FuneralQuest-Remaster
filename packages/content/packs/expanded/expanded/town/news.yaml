- id: 'elijah-lanyard'
  title: 'ELIJAH PROMOTED TO ASSISTANT TO THE ASSISTANT MANAGER'
  message: 'Di-Mart''s employee of the century now has a lanyard, a laminated schedule and a stool. He did not blink during the announcement, and the stool remains unused. The staff discount now covers "all friends of Elijah", a list that includes every undertaker in town.'
  effect: 'Di-Mart caskets 10% off today'
  weight: 3
  minDay: 13
  when:
    arcs:
