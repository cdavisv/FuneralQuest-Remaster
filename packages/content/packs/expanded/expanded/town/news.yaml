  title: 'AUDIT FINDS {mayor} KEPT ONE PROMISE, BY ACCIDENT'
  message: 'The Funeral Times counted forty-one campaign promises. {mayor} kept the one about more funerals. The audit was presented at a press conference, and {mayor} thanked the auditors and asked them to leave by the side door.'
  effect: 'customers 1 patience longer today'
  weight: 1.5
  minDay: 3
  when:
    mayor: true
  modifiers:
    - key: 'customer.patience'
