  message: 'The meter takes coins and, in a pinch, condolences. {mayor} cut the ribbon with garden shears and a great deal of confidence. Funeral processions park free; everyone else parks wherever the meter is pointing.'
  effect: 'families spend 5% more today'
  weight: 1.5
  minDay: 3
  when:
    mayor: true
  modifiers:
