  title: '''DIE LOCAL'' BUMPER STICKERS SELL OUT'
  message: 'The stickers have sold out twice. A man with very white teeth was seen buying one in Bigtown and pretending it was a gift. Families say they want a parlor with "a real front desk and a real smell".'
