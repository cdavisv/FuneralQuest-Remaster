      value: -10
- id: 'row-c-missing'
  title: 'FAMILIES FILE 61 ''MISSING GRANDPA'' REPORTS; POLICE FILE UNDER G'
  message: 'Row C is still empty and the filing cabinet is full. Police say most of the grandpas will "turn up eventually, one way or another". Families are hurrying to book plots they can watch from the window, and buying very good locks.'
  effect: 'grave robbers +10 luck, families spend 5% more'
  weight: 3
  minDay: 12
  when:
    arcs:
