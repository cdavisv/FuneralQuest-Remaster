  title: '{mayor} FRAMES NO-CONFIDENCE VOTE, HANGS IT BY THE STATUES'
  message: 'The council''s four-to-one vote now hangs in City Hall between the second and third statues. "It''s an honour to be doubted by so many," said {mayor}. The permit office, still nervous, is keeping its prices down.'
  effect: 'City Hall permits 15% cheaper today'
  weight: 3
