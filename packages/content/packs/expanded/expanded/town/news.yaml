  title: 'INSPECTOR MUDGE BUYS A NEW FLASHLIGHT'
  message: '"It has three settings," says Inspector Mudge. "Bright, brighter and closed by order of the county." To give businesses no excuse, City Hall has cut permit fees for the day. Nobody feels better.'
  effect: 'permits 20% cheaper today'
