  title: 'TWINS WRITE FROM BLAINE: ''WEATHER''S NICE, NOTHING ON FIRE'''
  message: 'The postcard to the fire brigade is signed twice and says the Twins are "taking up pottery". The kiln has worried the Blaine fire brigade, which has asked to borrow our dalmatian. The dalmatian declined and went back to sleep on the hose.'
