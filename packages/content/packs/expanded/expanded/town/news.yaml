  minDay: 20
  when:
    arcs:
      - id: 'cough'
        endings: [ 'credit' ]
  modifiers:
    - key: 'city.permitPrice'
      op: 'mul'
      value: 1.1
    - key: 'customer.limitMult'
      op: 'mul'
      value: 1.05
- id: 'statue-second-hand'
  title: 'UNKNOWN UNDERTAKER STATUE GROWS A SECOND HAND'
  message: 'Overnight someone added a second hand to the statue in the square, also palm up. Experts say pigeons cannot have done it. Mourners leave coins in both palms for luck, and the council collects them at dawn "for upkeep".'
  effect: 'richer customers, fewer risky offers'
  weight: 3
  minDay: 20
  when:
    arcs:
      - id: 'cough'
        endings: [ 'statue' ]
  modifiers:
    - key: 'customer.incomeShift'
      op: 'add'
      value: 5
    - key: 'wait.riskOdds'
      op: 'mul'
      value: 0.8
- id: 'morty-badge'
  title: 'MORTY ISSUED CITY HALL STAFF BADGE, PARKING SPACE'
  message: 'Morty has held the City Hall door since his concession and has not missed a day. "Best employee we''ve had," says {mayor}. "He has never asked for a day off to bury a relative." Permit clerks, inspired, are working through lunch.'
  effect: 'City Hall permits 10% off today'
  weight: 3
  minDay: 12
  when:
    arcs:
      - id: 'morty'
        endings: [ 'conceded' ]
  modifiers:
    - key: 'city.permitPrice'
      op: 'mul'
      value: 0.9
- id: 'morty-ribbon'
  title: 'HONORARY MAYOR MORTY OPENS BUS SHELTER BY STANDING NEXT TO IT'
  message: 'The ribbon was cut by {mayor}, who is still allowed the scissors. Morty gave a speech, which was a nod. The town is in an unusually good mood, though the shelter has no roof and Morty has been seen sitting under it anyway.'
  effect: 'customers a little calmer today'
  weight: 3
  minDay: 12
  when:
    arcs:
      - id: 'morty'
        endings: [ 'honorary' ]
  modifiers:
    - key: 'customer.mood'
      op: 'add'
      value: -0.2
- id: 'raccoon-service'
  title: 'RACCOON IN HAT SENTENCED TO COMMUNITY SERVICE AT GRAVEYARD'
  message: 'The county court gave the raccoon two hundred hours tending graves under the supervision of Deacon, who volunteered. Police say a human mastermind remains at large. The raccoon has already tidied Row C and is described as "very good with a trowel".'
  effect: 'grave robbers 10 luck worse today'
  weight: 3
  minDay: 10
  when:
    arcs:
      - id: 'robber'
        endings: [ 'caught' ]
  modifiers:
    - key: 'graveyard.robLuck'
