- id: 'gertie-cruise-sinks'
  title: 'GERTIE''S CANCELLED CRUISE SINKS AT THE DOCK'
  message: 'The ship Nurse Gertie was meant to board went down before leaving the harbor. Everyone got off, apart from the buffet. "I''d have been in the good lifeboat, prince," she says. Cousin Sal is selling lifeboats, which are cheaper than the hospital and about as sound.'
  effect: 'hospital treatment 10% cheaper today'
  weight: 3
  minDay: 15
  when:
    arcs:
      - id: 'gertie'
        endings: [ 'stays' ]
  modifiers:
