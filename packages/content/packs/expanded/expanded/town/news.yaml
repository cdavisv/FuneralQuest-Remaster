      op: 'mul'
      value: 0.9
- id: 'dimart-surcharge'
  title: 'DI-MART ADDS SURCHARGE TO COVER THE PAPERWORK OF THE PAPERWORK'
  message: 'Elijah''s holding company has issued a surcharge notice for the cost of issuing surcharge notices. Caskets are up. Elijah is at the register, where the forms are stacked to the ceiling and the ceiling is stacked on Elijah.'
  effect: 'Di-Mart caskets 15% dearer today'
