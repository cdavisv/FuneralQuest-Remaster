  title: 'PLOT RENTS NOW TRAVEL TO BIGTOWN BY BUS'
  message: 'Cemetery rents leave for SolemnCorp''s head office on the morning bus and come back, reduced, on the afternoon one. "The delay is for your convenience," says the man with the teeth. The grass has never looked better, and nobody can afford to stand on it.'
