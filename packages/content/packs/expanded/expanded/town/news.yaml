  title: 'WITHERS PLANS SECOND WAKE, ''BIGGER, WITH A BAND'''
  message: 'After the success of the first, Old Man Withers will hold a living wake every Saturday until he really does die, "so everyone''s in practice". Father Smyth has ordered more dry cake. The town is in a generous mood, and so are its wallets.'
