- id: 'withers-hearse-laps'
  title: 'WITHERS'' NEW HEARSE CIRCLES THE REAPER CLUB ''FOR PRACTICE'''
  message: 'Old Man Withers, winner of his own death pool, drives a lap of the club every hour on the hour. "Dress rehearsal," he says. "Somebody has to know where the brake is." Gamblers have opened a second pool on how long the first one lasts.'
  effect: 'Reaper Club cover 1 tag dearer, more unusual customers'
  weight: 3
  minDay: 17
  when:
    arcs:
