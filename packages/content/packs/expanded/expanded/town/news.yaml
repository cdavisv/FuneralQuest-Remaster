  message: 'Doris Fenwick was turned down for the Parks Department on the grounds that it is a department. She is handing out toothbrushes outside the library, and a statue of {mayor} has been moved to make room. The town is in a pleasant mood.'
  effect: 'customers a little calmer today'
  weight: 3
  minDay: 20
  when:
