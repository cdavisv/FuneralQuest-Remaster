# Expanded pack: new risks, appended after Classic's ten (pack.yaml has merge: append).
# The risk button shows first, the safe one second. Safe (normal) always earns a few BP;
# the gamble wins (success) or loses (fail) the risk amount on luck.
# Placeholders: *SIR*, *NAME*, *PARLOR*; \n is a line break.

- startMessage: '`$A man in a bathrobe bursts into the showroom.\n\n`wMan: `$"Hello *SIR*, you buried my wife last week. Was she wearing her reading glasses? She can''t see a thing without them."\n\nThe glasses are on your nose. They''re a really good prescription.'
  startPicture: 'people/m_old_2'
  normalLabel: 'Hand Over'
  riskLabel: 'Deny It'
  normalMessage: '`w*NAME*: `$"These? Oh, these are hers. I was just... keeping them warm."\n\n`wMan: `$"Bless you. She''ll want to read in heaven."'
  normalPicture: 'people/jesus_happy'
  failMessage: '`w*NAME*: `$"Glasses? I''m afraid she went in without them, sir."\n\n`wMan: `$"Then why does your nose have her rhinestones on it?"\n\nHe takes the glasses, and then your clipboard, and then your dignity.'
  failPicture: 'stuff/money_bag'
  successMessage: '`w*NAME*: `$"Glasses? I''m afraid she went in without them, sir."\n\nHe shuffles out, squinting. You can finally read the fine print on your Di-Mart invoices. Elijah has been overcharging you for years.'
  successPicture: 'stuff/money_bag_2'

- startMessage: '`$Digging a fresh grave, your shovel clangs on a rusty strongbox. It is marked "PROPERTY OF THE DEATHVILLE COUNTY MUSEUM".\n\nThe museum closed in 1962. Probably nobody remembers it.'
  startPicture: 'stuff/safe'
  startBackground: 'background/background_7'
  normalLabel: 'Report It'
  riskLabel: 'Pry It Open'
  normalMessage: '`$You call city hall. The Mayor takes the box, holds a press conference, and somehow never mentions your name. Still, the paper prints a photo of your shovel.'
  normalPicture: 'people/jesus_happy'
  failMessage: '`$You pry the box open behind the shed.\n\nInside: a mummified cat and a note reading "WHOEVER OPENS THIS IS CURSED." The cat looks very sure about it. Your luck goes sour by dinner.'
  failPicture: 'stuff/battle_lose'
  successMessage: '`$You pry the box open behind the shed.\n\nInside: old silver dollars, a pocket watch, and a perfectly good ham sandwich from 1962. You keep everything but the sandwich. You think about it. You keep the sandwich too.'
  successPicture: 'stuff/money_bag_2'

- startMessage: '`$A rival''s hearse is parked outside the Pale Horse Cafe with the engine running. The driver is inside ordering pie.\n\nThe body in the back is headed for a funeral across town. It could just as easily be headed for *PARLOR*.'
  startPicture: 'hearse/hearse3'
  normalLabel: 'Walk On'
  riskLabel: 'Drive Off'
  normalMessage: '`$You walk on by. Stealing a corpse in broad daylight is beneath you. You''d at least wait until dusk.'
  normalPicture: 'people/jesus_happy'
  failMessage: '`$You hop in and floor it.\n\nTwo blocks later you realize the hearse has a GPS tracker, a dashcam, and the driver''s mother in the passenger seat. She hits you with her purse the whole way to the police station.'
  failPicture: 'places/funeral_enemy_police'
  successMessage: '`$You hop in and floor it.\n\nBy the time the driver finishes his pie, the deceased is resting comfortably in your slumber room and the family is signing your paperwork. Nobody asks why the hearse is a different color.'
  successPicture: 'hearse/hearse4'

- startMessage: '`$The embalming pump makes a noise like a goose being stepped on and quits.\n\nYou have a viewing at four. The manual says "DO NOT OPERATE BY HAND." It does not say why.'
  startBackground: 'places/embalming-room'
  normalLabel: 'Call Repair'
  riskLabel: 'Pump By Hand'
  normalMessage: '`$You call the repairman. He arrives in twenty minutes, charges you double, and lectures you about filters. The viewing goes off without a hitch.'
  normalPicture: 'people/jesus_happy'
  failMessage: '`$You roll up your sleeves and start pumping by hand.\n\nNow you know why. The hose comes loose and the embalming room gets a fresh coat of pink. So do you. So does the family, who came early.'
  failPicture: 'stuff/money_bag'
  failBackground: 'places/embalming-room'
  successMessage: '`$You roll up your sleeves and start pumping by hand.\n\nIt takes three hours and your forearms are now enormous, but the body looks great. The repairman''s bill stays in his pocket.'
  successPicture: 'stuff/money_bag_2'
  successBackground: 'places/embalming-room'

- startMessage: '`$Father Smyth leaves the collection plate from the bake sale on your counter while he goes to find his car keys.\n\nThere is over two hundred dollars in it. And a lemon bar.'
  startPicture: 'people/churchguy_h'
  startBackground: 'background/background_church'
  normalLabel: 'Guard It'
  riskLabel: 'Skim It'
  normalMessage: '`$You stand guard over the plate like a soldier. Father Smyth returns and blesses you for your honesty. He also takes the lemon bar back, which seems unnecessary.'
  normalPicture: 'people/jesus_happy'
  failMessage: '`$You slip a few bills into your pocket.\n\n`wFather Smyth: `$"I counted it before I left, my child."\n\nHe makes you put it back, plus interest, plus a donation, plus you''re running the ring toss at the next carnival.'
  failPicture: 'people/churchguy_h'
  successMessage: '`$You slip a few bills into your pocket.\n\nFather Smyth comes back, picks up the plate and says "The Lord provides." He''s right. The Lord just provided for you.'
  successPicture: 'stuff/money_bag_2'

- startMessage: '`$A crate arrives from Di-Mart addressed to a rival parlor. It''s a brand new Gold casket, delivered to you by mistake.\n\nElijah''s delivery boy, who is 64, is already driving away.'
  startPicture: 'people/store_guy'
  normalLabel: 'Send It On'
  riskLabel: 'Keep It'
  normalMessage: '`$You call Di-Mart and they send the boy back for it. It takes him most of the afternoon. Elijah thanks you without blinking, which is how he does everything.'
  normalPicture: 'people/jesus_happy'
  failMessage: '`$You drag it into the storeroom and slap your own price tag on it.\n\nThat night Elijah appears in your window. He does not knock. He does not blink. You have no idea how long he''s been standing there. You pay for the casket.'
  failPicture: 'people/store_guy'
  successMessage: '`$You drag it into the storeroom and slap your own price tag on it.\n\nThe rival blames Di-Mart, Di-Mart blames the boy, and the boy blames his hip. You sell the casket by lunch.'
  successPicture: 'stuff/money_bag_2'

- startMessage: '`$A grieving widow asks if you can play her husband''s favorite song at the service. She hands you a cassette labeled "HAROLD - DO NOT ERASE".\n\nYou don''t have a cassette player. You do have a kazoo.'
  startPicture: 'people/f_old'
  normalLabel: 'Buy a Deck'
  riskLabel: 'Kazoo It'
  normalMessage: '`$You drive to Di-Mart and buy a tape deck at the emergency price. The song plays. Harold''s widow weeps. It''s polka, but she weeps.'
  normalPicture: 'people/jesus_happy'
  failMessage: '`$At the service you perform the song by ear on kazoo.\n\nYou don''t know the song. You play something you heard in an elevator. The widow stands up in the middle of the second verse and leaves the chapel. So does everyone else.'
  failPicture: 'places/funeral-ceremony'
  successMessage: '`$At the service you perform the song by ear on kazoo.\n\nIt is so bad it loops back around to beautiful. People are still talking about it at the reception. Two families book you on the spot.'
  successPicture: 'places/funeral-ceremony2'

- startMessage: '`$The Nurse calls from the hospital.\n\n`wNurse: `$"Hi prince! Somebody left a body down here with no toe tag. First parlor to sign for it gets it. Want me to put your name down? Nobody would know if, you know, the paperwork got creative."'
  startPicture: 'places/hospital_desk'
  normalLabel: 'By the Book'
  riskLabel: 'Get Creative'
  normalMessage: '`w*NAME*: `$"Let''s do it properly. Find the family first."\n\n`wNurse: `$"Oh, you''re no fun. But you''re honest-no-fun, and that''s the best kind."\n\nShe sends you a referral anyway.'
  normalPicture: 'people/jesus_happy'
  failMessage: '`w*NAME*: `$"Put me down. Say it''s my uncle."\n\nThe body turns out to be the Mayor''s brother-in-law. He was not your uncle. The Mayor would like a word, and the word is "audit".'
  failPicture: 'places/funeral_enemy_police'
  successMessage: '`w*NAME*: `$"Put me down. Say it''s my uncle."\n\nUncle Mystery gets a lovely service. The family turns up a week later, sees how nice it was, and pays the whole bill without asking questions.'
  successPicture: 'stuff/money_bag_2'

- startMessage: '`$Morty the skeleton has fallen off his hook and lost a finger bone down the floor drain.\n\nYou could fish it out. Or you could borrow one from a client. They''re not using it.'
  startPicture: 'people/morty'
  normalLabel: 'Fish It Out'
  riskLabel: 'Borrow One'
  normalMessage: '`$You spend an hour with a coat hanger and a flashlight and get Morty''s finger back. He seems grateful. It''s hard to tell. It''s always hard to tell with Morty.'
  normalPicture: 'people/jesus_happy'
  failMessage: '`$You borrow a finger from the gentleman in the cold room.\n\nAt his open-casket viewing, his daughter counts. Out loud. Up to nine.'
  failPicture: 'mother/finger'
  successMessage: '`$You borrow a finger from the gentleman in the cold room.\n\nMorty looks complete again, and the gentleman is buried in gloves. Nobody counts. Nobody ever counts.'
  successPicture: 'stuff/money_bag_2'

- startMessage: '`$The Twins are leaning on your mailbox, sharing a single cigarette.\n\n`wThe Twins: `y"We could make that new parlor across town have a really warm evening. For you, a discount. Half price. We just like the work."'
  startPicture: 'places/fire'
  normalLabel: 'No Thanks'
  riskLabel: 'Shake Hands'
  normalMessage: '`$You tell the Twins to get off your property. They leave together, in step, without looking back. It is the creepiest thing you have seen all week, and you work with corpses.'
  normalPicture: 'people/jesus_happy'
  failMessage: '`$You shake both their hands, one after the other.\n\nThe Twins are very thorough. They burn down the wrong parlor. It is yours. They send you a bill.'
  failPicture: 'places/fire'
  successMessage: '`$You shake both their hands, one after the other.\n\nThat night the sky across town glows orange. The next morning the rival''s families are lined up outside *PARLOR*, smelling faintly of smoke.'
  successPicture: 'stuff/money_bag_2'

- startMessage: '`$A man in a very nice suit asks if you could cremate "a few boxes of old paperwork" along with his late business partner.\n\nThe boxes are labeled EVIDENCE. He offers cash.'
  startPicture: 'people/m_adult_4'
  startBackground: 'places/creamation_oven'
  normalLabel: 'Refuse'
  riskLabel: 'Fire It Up'
  normalMessage: '`$You politely decline. He politely leaves. You politely call the police, who politely thank you and buy a pre-need plan on the way out.'
  normalPicture: 'people/jesus_happy'
  failMessage: '`$You toss the boxes in with the partner.\n\nThe smoke from your chimney spells out, very faintly, "TAX FRAUD". The fire department comes. Then the police. Then three men from the state who do not smile.'
  failPicture: 'places/funeral_enemy_police'
  successMessage: '`$You toss the boxes in with the partner.\n\nThe cash is crisp, the partner burns evenly, and the man in the suit leaves you a business card that just says "WE''LL BE IN TOUCH". Hopefully that''s good.'
  successPicture: 'stuff/money_bag_2'

- startMessage: '`$The Teller at the bank counts your deposit twice, frowns, and slides it back.\n\n`wTeller: `$"There''s an extra five hundred here, *SIR*. Someone else''s envelope must have gotten mixed in with yours. Would you like to... look again?"'
  startPicture: 'places/bank'
  normalLabel: 'Not Mine'
  riskLabel: 'All Mine'
  normalMessage: '`w*NAME*: `$"That''s not mine."\n\n`wTeller: `$"How refreshing. I''ll make a note that you can count."\n\nThe Teller almost smiles. The rightful owner sends you a thank-you fruit basket.'
  normalPicture: 'people/jesus_happy'
  failMessage: '`w*NAME*: `$"Oh, that''s definitely mine. I earned it."\n\n`wTeller: `$"Interesting, since it''s in an envelope that says ORPHANAGE."\n\nThe Teller closes the window in your face, slowly, and you have to stand in line again to pay it back.'
  failPicture: 'stuff/money_bag'
  successMessage: '`w*NAME*: `$"Oh, that''s definitely mine. I earned it."\n\n`wTeller: `$"Very well. I''m sure you did."\n\nShe doesn''t believe you. But she doesn''t do paperwork after four, either.'
  successPicture: 'stuff/money_bag_2'

- startMessage: '`$Old Man Withers falls asleep in your showroom, sitting up in a Silver casket.\n\nHe''s breathing. Probably. A family is coming in at noon to pick out a casket and he''s in the nicest one.'
  startPicture: 'people/m_old_3'
  normalLabel: 'Wake Him'
  riskLabel: 'Use Him'
  normalMessage: '`$You gently wake him. He accuses you of trying to bury him alive, buys nothing, eats three of your mints and leaves. Still, he tells everyone at bingo you''ve got comfy caskets.'
  normalPicture: 'people/jesus_happy'
  failMessage: '`$You fold his hands on his chest and tell the family he''s "a display model".\n\nHalfway through your pitch Withers sits bolt upright and shouts "BINGO!" The mother faints. The father takes his business, and his wife, to Blaine.'
  failPicture: 'stuff/battle_lose'
  successMessage: '`$You fold his hands on his chest and tell the family he''s "a display model".\n\nThey are so impressed by how peaceful he looks that they buy the Silver on the spot, then a second one for Grandma. Withers sleeps through the whole sale.'
  successPicture: 'stuff/money_bag_2'

- startMessage: '`$A wreath arrives for the Pickett funeral. The card reads "With deepest sympathy, from *PARLOR*."\n\nYou didn''t send it. A rival did, and spelled your name on it by mistake. You could just leave it there.'
  startPicture: 'stuff/red_rose'
  startBackground: 'background/background_celemony'
  normalLabel: 'Fix the Card'
  riskLabel: 'Take Credit'
  normalMessage: '`$You call the florist and have the card corrected. It hurts. It hurts a lot. But your conscience is clean, which is more than you can say for your hearse.'
  normalPicture: 'people/jesus_happy'
  failMessage: '`$You leave the card and accept the family''s thanks with a solemn nod.\n\nThen the rival shows up at the service with the receipt. He reads it out loud, slowly, during the eulogy.'
  failPicture: 'places/funeral-ceremony'
  successMessage: '`$You leave the card and accept the family''s thanks with a solemn nod.\n\nThe Picketts are so touched they send all their remaining relatives your way. There are a lot of Picketts. They die a lot.'
  successPicture: 'stuff/money_bag_2'

- startMessage: '`$The town''s water main has burst and the old section of your graveyard is a lake. Two caskets are floating toward the road.\n\nYou could fish them back. Or you could call them "a new water feature" and charge admission.'
  startBackground: 'background/background_7'
  normalLabel: 'Fish Them'
  riskLabel: 'Charge Entry'
  normalMessage: '`$You wade in up to your armpits and tow the caskets home with a rope. The families never find out. You find out what was in the water, and you shower for a week.'
  normalPicture: 'people/jesus_happy'
  failMessage: '`$You put up a sign: "LAKE OF THE DEAD - $2".\n\nThe first paying customer is the Deathville Enquirer. The second is the health inspector. The third is a lawyer, floating past on a casket lid.'
  failPicture: 'places/funeral_enemy_police'
  successMessage: '`$You put up a sign: "LAKE OF THE DEAD - $2".\n\nBy noon there is a line around the block, a hot dog cart, and a couple getting engaged on a floating headstone. You''ve never made more money from the dead without burying anyone.'
  successPicture: 'stuff/money_bag_2'

- startMessage: '`$You''re out of burial suits. The deceased is a large man and the only thing his size in the building is your own good suit, the one you wear to conventions.\n\nOr there''s the curtain.'
  startBackground: 'places/embalming-room'
  normalLabel: 'Your Suit'
  riskLabel: 'The Curtain'
  normalMessage: '`$You dress him in your good suit. He looks better in it than you ever did. You''ll miss that suit. The family won''t stop thanking you.'
  normalPicture: 'people/jesus_happy'
  failMessage: '`$You stitch together a quick suit from the showroom curtains.\n\nThe pattern is very loud. At the viewing, a woman asks why her uncle is wearing her old living room. It was her old living room. You bought the curtains at her yard sale.'
  failPicture: 'stuff/money_bag'
  successMessage: '`$You stitch together a quick suit from the showroom curtains.\n\nVelvet, tassels, the works. The family thinks it''s a designer piece and asks where they can get one. You take three orders.'
  successPicture: 'stuff/money_bag_2'

- startMessage: '`$A drunk wanders into the showroom at closing time and lies down in your cheapest Wood casket.\n\n`wDrunk: `$"Jus'' five minutes... I''ll pay ya..."\n\nHe has a very full wallet sticking out of his back pocket.'
  startPicture: 'people/m_adult_u'
  normalLabel: 'Call a Cab'
  riskLabel: 'Rent It'
  normalMessage: '`$You call him a cab and pour him into it. The next day he comes back, embarrassed, and pre-pays for a funeral. "Same box," he says. "It was comfy."'
  normalPicture: 'people/jesus_happy'
  failMessage: '`$You close the lid and start a meter.\n\nAt two in the morning he wakes up in the dark, in a box, and screams for an hour. The neighbors call the police, the police call the paper, and the paper calls you "THE COFFIN MOTEL".'
  failPicture: 'places/funeral_enemy_police'
  successMessage: '`$You close the lid and start a meter.\n\nIn the morning he climbs out refreshed, pays the overnight rate plus breakfast, and tells all his friends. You may have invented something.'
  successPicture: 'stuff/money_bag_2'

- startMessage: '`$During a viewing, the deceased''s toupee slides off and lands in the punch bowl.\n\nNobody has noticed yet. You could fish it out in front of everyone, or you could quietly move the punch bowl into the back.'
  startBackground: 'background/background_celemony'
  normalLabel: 'Fish It Out'
  riskLabel: 'Hide Bowl'
  normalMessage: '`$You fish the toupee out with the ladle, wring it into a napkin, and put it back on with dignity. Somebody claps. It''s a sincere clap.'
  normalPicture: 'people/jesus_happy'
  failMessage: '`$You lift the bowl and casually walk toward the kitchen.\n\nThe widow stops you to get a refill. She ladles out the toupee. She holds it up. She looks at her husband. She looks at you.'
  failPicture: 'stuff/money_bag'
  successMessage: '`$You lift the bowl and casually walk toward the kitchen.\n\nYou swap it for a fresh one and nobody suspects a thing. The deceased spends eternity with a hat on, and the family thinks it was his wish.'
  successPicture: 'stuff/money_bag_2'

- startMessage: '`$You find a spare key to a rival''s parlor on the sidewalk. The tag says "BACK DOOR".\n\nTheir big funeral is tomorrow. You could just go and have a look around. A long look. With a screwdriver.'
  startPicture: 'stuff/lockpick'
  startBackground: 'places/funeral_enemy'
  normalLabel: 'Return It'
  riskLabel: 'Pay a Visit'
  normalMessage: '`$You return the key. The rival is so stunned by your decency that he gives you a box of donuts and a hearse air freshener. It''s a good air freshener.'
  normalPicture: 'people/jesus_happy'
  failMessage: '`$You let yourself in at midnight and loosen every casket hinge in the building.\n\nThe rival is waiting in the dark with a flashlight, a camera and a very large dog. You are on the front page in your pajamas.'
  failPicture: 'places/funeral_enemy_police'
  successMessage: '`$You let yourself in at midnight and loosen every casket hinge in the building.\n\nAt tomorrow''s big funeral the lid flops off during the eulogy. The family walks straight across the street to *PARLOR*.'
  successPicture: 'stuff/money_bag_2'

- startMessage: '`$Mr. Yang delivers lunch himself and leaves his delivery bag on your counter while he uses the restroom.\n\nInside are four more orders, and a whole stack of fortune cookies. One of them could have your name on it. Literally, if you had a pen.'
  startPicture: 'chinese_takeout'
  normalLabel: 'Leave It'
  riskLabel: 'Rewrite One'
  normalMessage: '`$You leave the bag alone. Mr. Yang comes back, notices, and gives you an extra egg roll. "You are a good customer," he says. "Too pale. But good."'
  normalPicture: 'people/jesus_happy'
  failMessage: '`$You slip a fortune into a rival''s cookie: "YOUR PARLOR SMELLS. EVERYONE SAYS SO."\n\nJune recognizes your handwriting from the tip line on your receipts. Yang''s bans you for a week and tapes your photo to the register.'
  failPicture: 'people/yangsgirl'
  successMessage: '`$You slip a fortune into a rival''s cookie: "YOUR PARLOR SMELLS. EVERYONE SAYS SO."\n\nThe rival reads it out loud at the Pale Horse Cafe. Everyone agrees. He spends the next day scrubbing instead of selling.'
  successPicture: 'stuff/money_bag_2'

- startMessage: '`$A family wants their grandfather buried with his old war medals. They look very real and very valuable. The family is in a hurry and won''t be checking the casket.'
  startPicture: 'stuff/question'
  normalLabel: 'Bury Them'
  riskLabel: 'Swap Them'
  normalMessage: '`$You pin the medals on his chest and salute. It feels good, actually. You''d forgotten what that felt like.'
  normalPicture: 'people/jesus_happy'
  failMessage: '`$You swap the medals for bottle caps painted gold and take the real ones to a collector.\n\nThe collector is grandpa''s old army buddy. He is very old and very strong, and he wants a word in the parking lot.'
  failPicture: 'stuff/battle_lose'
  successMessage: '`$You swap the medals for bottle caps painted gold and take the real ones to a collector.\n\nGrandpa goes to his rest looking very decorated in the dim light. The collector pays cash. You try not to think about it.'
  successPicture: 'stuff/money_bag_2'

- startMessage: '`$The county inspector is on his way for the yearly check of the embalming room. The drain is clogged with something you''d rather not name.\n\nYou could fix it, or you could put a rug over it.'
  startBackground: 'places/embalming-room'
  normalLabel: 'Fix Drain'
  riskLabel: 'Rug It'
  normalMessage: '`$You snake the drain. What comes out will haunt you, but the inspector gives you a passing grade and a lollipop. He gives everyone a lollipop.'
  normalPicture: 'people/jesus_happy'
  failMessage: '`$You throw a nice rug over the drain and stand on it, smiling.\n\nThe inspector asks you to step aside. The rug gurgles. He writes for a long time, then asks for a second clipboard.'
  failPicture: 'places/funeral_enemy_police'
  successMessage: '`$You throw a nice rug over the drain and stand on it, smiling.\n\nThe inspector compliments the rug, signs the form, and leaves. The rug is ruined, but rugs are cheaper than fines.'
  successPicture: 'stuff/money_bag_2'

- startMessage: '`$A teenager offers to film your next funeral for his online video channel.\n\n`wTeen: `$"It''ll go totally viral, dude. People love sad stuff. Do I get to touch the body?"'
  startPicture: 'people/m_teen'
  normalLabel: 'Say No'
  riskLabel: 'Roll Camera'
  normalMessage: '`$You tell him funerals are private. He calls you "a total grandpa" and leaves. The family is grateful. Grandpas, it turns out, are good for business.'
  normalPicture: 'people/jesus_happy'
  failMessage: '`$You let him film.\n\nThe video goes viral, all right. It''s called "FUNERAL GUY TRIPS INTO GRAVE (NOT CLICKBAIT)". Three million people watch you fall in. Nobody in Deathville will make eye contact.'
  failPicture: 'stuff/battle_lose'
  successMessage: '`$You let him film.\n\nThe video, "MOST BEAUTIFUL FUNERAL EVER?? (CRYING)", gets a million views. People drive in from Blaine just to die near your parlor. Some of them manage it.'
  successPicture: 'stuff/money_bag_2'

- startMessage: '`$A scruffy man in a lab coat knocks on your back door at midnight.\n\n`wCousin Sal: `$"Hey, buddy. Got a guy here. Paperwork''s coming. Probably. Can you hold him in your cold room for a couple days? I''ll make it worth your while."'
  startPicture: 'people/m_doctor'
  normalLabel: 'Close Door'
  riskLabel: 'Hold Him'
  normalMessage: '`$You close the door on Cousin Sal. Through the wood you hear him say "your loss, buddy" and then the sound of a station wagon refusing to start. You sleep like a baby.'
  normalPicture: 'people/jesus_happy'
  failMessage: '`$You wheel the guy into the cold room and take Sal''s cash.\n\nThe guy is the missing bank robber from the Deathville Enquirer. The police find him behind your ice cream. They also find the ice cream.'
  failPicture: 'places/funeral_enemy_police'
  successMessage: '`$You wheel the guy into the cold room and take Sal''s cash.\n\nTwo days later Sal comes back with the paperwork, which is mostly legible. You do the service. Sal pays you twice by mistake.'
  successPicture: 'stuff/money_bag_2'

- startMessage: '`$Lightning strikes the big oak in your graveyard and splits it right down the middle.\n\nUnder the roots is a coffin with no headstone and no record. Its lid has a little brass plate that says only "RICH".'
  startBackground: 'background/background_1'
  normalLabel: 'Rebury It'
  riskLabel: 'Open It'
  normalMessage: '`$You rebury the coffin, plant a sapling and say a few words. Father Smyth hears about it and mentions you in Sunday''s sermon under "people who did not open the coffin".'
  normalPicture: 'people/jesus_happy'
  failMessage: '`$You pry open the lid.\n\nInside is Mr. Rich, who was a magician. His last trick is a spring-loaded snake, a cloud of purple powder and an air horn. Your hair is purple for a month.'
  failPicture: 'stuff/battle_lose'
  successMessage: '`$You pry open the lid.\n\nMr. Rich was, it turns out, rich. Gold teeth, gold cufflinks and a gold-plated harmonica. You play one song on it in his honor, then sell it.'
  successPicture: 'stuff/money_bag_2'

- startMessage: '`$A woman pays in full for her husband''s funeral and leaves. Ten minutes later you realize she paid twice: once by check and once in cash.\n\nShe left her phone number. In very large handwriting.'
  startPicture: 'mother/normal'
  normalLabel: 'Call Her'
  riskLabel: 'Pocket It'
  normalMessage: '`$You call and refund the cash. She is so grateful she cries on the phone, then tells her entire book club. The book club is mostly widows. Book clubs are always mostly widows.'
  normalPicture: 'mother/happy'
  failMessage: '`$You pocket the cash and lose the phone number.\n\nShe comes back for her reading glasses and sees her own twenties in your tip jar. She knows they''re hers. She writes her initials on all of them.'
  failPicture: 'mother/finger'
  successMessage: '`$You pocket the cash and lose the phone number.\n\nShe never notices. She was very rich and very sad and is now in Florida. You buy a better coffee maker in her honor.'
  successPicture: 'stuff/money_bag_2'

- startMessage: '`$Elijah offers you a pallet of "slightly used" caskets at a fraction of the wholesale price.\n\n`wElijah: `$"No questions about where they came from. And I mean that as a rule, not a suggestion."\n\nHe does not blink while he says it.'
  startPicture: 'people/store_guy'
  startBackground: 'places/store'
  normalLabel: 'Pass'
  riskLabel: 'Buy Pallet'
  normalMessage: '`$You pass. Elijah stares at you for a full minute, then writes something in a little black book. You decide not to ask what.'
  normalPicture: 'people/jesus_happy'
  failMessage: '`$You buy the pallet.\n\nThe first one you sell still has a name engraved inside the lid. The name belongs to the customer''s grandmother. She was buried last spring. In Blaine. In that casket.'
  failPicture: 'stuff/money_bag'
  successMessage: '`$You buy the pallet.\n\nA little sanding, a little polish, a new satin lining. Good as new. Nobody needs to know they''re on their second tour of duty.'
  successPicture: 'stuff/money_bag_2'

- startMessage: '`$The Mayor''s portrait at city hall is being painted, and he wants a "dramatic graveyard background".\n\nHe''s offered to pose among your headstones. He''d like it if one of the headstones had his name on it, "for gravitas".'
  startBackground: 'background/background_3'
  normalLabel: 'Real Stones'
  riskLabel: 'Fake Stone'
  normalMessage: '`$You let him pose among the real headstones. He grumbles, but the painting comes out moody and grand, and it hangs in city hall with a little plaque thanking *PARLOR*.'
  normalPicture: 'people/jesus_happy'
  failMessage: '`$You carve a quick headstone with the Mayor''s name and today''s date.\n\nThe local paper runs the photo without the caption. Half the town thinks the Mayor is dead. The other half is disappointed when they find out he isn''t. He blames you for both halves.'
  failPicture: 'stuff/battle_lose'
  successMessage: '`$You carve a quick headstone with the Mayor''s name and today''s date.\n\nThe Mayor loves it so much he buys it, and a plot to go under it, and the plot next to it "for the dog".'
  successPicture: 'stuff/money_bag_2'

- startMessage: '`$Two families have booked the chapel for the same time. Both are paying full price. Both have already sent the invitations.\n\nYou could cancel one, or you could try to do both funerals at once and hope nobody notices.'
  startBackground: 'background/background_church'
  normalLabel: 'Cancel One'
  riskLabel: 'Double Up'
  normalMessage: '`$You call the second family, apologize, and move them to tomorrow with a free floral arrangement. They''re disappointed but impressed. Mostly impressed by the flowers.'
  normalPicture: 'people/jesus_happy'
  failMessage: '`$You put a curtain down the middle of the chapel and run back and forth.\n\nYou get the names mixed up in both eulogies. Two widows meet behind the curtain and compare notes. They compare them loudly.'
  failPicture: 'places/funeral-ceremony'
  successMessage: '`$You put a curtain down the middle of the chapel and run back and forth.\n\nBoth families think you gave them your full attention. You''ve never sweated so much in a suit, and you''ve never been paid so well for it.'
  successPicture: 'stuff/money_bag_2'

- startMessage: '`$Your hearse needs new tires before tomorrow''s procession. The tire shop is closed. A rival''s hearse is parked next door with four beautiful new ones.\n\nYou have a jack.'
  startPicture: 'hearse/hearse2'
  normalLabel: 'Drive Slow'
  riskLabel: 'Swap Tires'
  normalMessage: '`$You drive the procession at eight miles an hour on your bald tires. The mourners think it''s a mark of respect. You let them.'
  normalPicture: 'people/jesus_happy'
  failMessage: '`$You swap all four tires in the dark.\n\nThe rival''s security light comes on halfway through. He watches from his window, eating cereal, then calls the police, then calls the Enquirer, then calls his mother, for some reason.'
  failPicture: 'places/funeral_enemy_police'
  successMessage: '`$You swap all four tires in the dark.\n\nThe next morning your hearse glides through town like a swan. The rival''s hearse sits on blocks. He doesn''t make it to the cemetery. You do.'
  successPicture: 'hearse/hearse4'

- startMessage: '`$A man in a tracksuit wants to rent a casket "for a magic trick" at a birthday party.\n\n`wMan: `$"I lie in it, they nail it shut, I escape. It''s my big finish. I''ve done it twice. Well, once."'
  startPicture: 'people/m_adult_2'
  normalLabel: 'No Rentals'
  riskLabel: 'Rent It Out'
  normalMessage: '`$You explain that caskets are for the dead and not for party tricks. He leaves sulking. A week later he comes back to buy one for real, for his manager.'
  normalPicture: 'people/jesus_happy'
  failMessage: '`$You rent him your best Silver.\n\nHe does not escape. The party guests clap for twenty minutes before anyone gets a crowbar. He''s fine, but the casket is not, and he wants a refund.'
  failPicture: 'stuff/money_bag'
  successMessage: '`$You rent him your best Silver.\n\nHe escapes in a puff of smoke to wild applause. He returns the casket the next day, a bit scratched, with a tip and a coupon for a free balloon animal.'
  successPicture: 'stuff/money_bag_2'

- startMessage: '`$Your Forever Fragrant air freshener order hasn''t come and today''s viewing is a man who''s been in a hot attic for a while.\n\nThere is a can of bug spray, a bottle of vanilla extract, and half a pizza.'
  startBackground: 'background/background_celemony'
  normalLabel: 'Cancel It'
  riskLabel: 'Improvise'
  normalMessage: '`$You call the family and postpone the viewing until the order arrives. They''re grateful. Nobody wants that kind of memory, even of someone they didn''t like.'
  normalPicture: 'people/jesus_happy'
  failMessage: '`$You mix the bug spray and the vanilla into a fine mist and fill the room with it.\n\nThe mourners now smell like cookies and poison. One of them sneezes on the body. The whole room starts sneezing. You can''t stop sneezing. It''s on the news.'
  failPicture: 'stuff/money_bag'
  successMessage: '`$You mix the bug spray and the vanilla into a fine mist and fill the room with it.\n\nThe mourners say the room smells "like Grandma''s house". The family asks for the recipe. You decide to bottle it.'
  successPicture: 'stuff/money_bag_2'

- startMessage: '`$A pigeon has flown into the chapel and is perched on the casket during a service. The family thinks it''s the spirit of their dear departed.\n\nYou know it''s just a pigeon. It''s the same pigeon from last week.'
  startPicture: 'stuff/question'
  startBackground: 'background/background_church'
  normalLabel: 'Shoo It'
  riskLabel: 'Play Along'
  normalMessage: '`$You open a window and politely wave the pigeon outside. The family is a little sad, but you''ve saved them from what pigeons inevitably do next.'
  normalPicture: 'people/jesus_happy'
  failMessage: '`$You announce, in your most solemn voice, that the spirit has come to say goodbye.\n\nThe spirit poops on the widow. Then on the urn. Then on Father Smyth. Father Smyth says "this can''t be good" and goes home.'
  failPicture: 'stuff/battle_lose'
  successMessage: '`$You announce, in your most solemn voice, that the spirit has come to say goodbye.\n\nThe pigeon coos, flaps once and flies away right on cue. There isn''t a dry eye in the house. The family pays extra for "the bird service".'
  successPicture: 'stuff/money_bag_2'

- startMessage: '`$At the Spirit University library you find an old thesis titled "Upselling the Bereaved Through Hypnosis". The library computer is busy, so nobody is watching.\n\nThe chapter on swinging a pocket watch looks promising.'
  startPicture: 'places/psych'
  normalLabel: 'Put It Back'
  riskLabel: 'Try It'
  normalMessage: '`$You put the thesis back on the shelf. Some things are too evil even for the funeral business. You check out a book on bereavement counseling instead. It''s surprisingly useful.'
  normalPicture: 'people/jesus_happy'
  failMessage: '`$You swing your pocket watch in front of the next customer and murmur "gold casket... gold casket..."\n\nHe hypnotizes you instead. You wake up an hour later having bought his car.'
  failPicture: 'stuff/money_bag'
  successMessage: '`$You swing your pocket watch in front of the next customer and murmur "gold casket... gold casket..."\n\nShe buys the gold casket, the plot, a statue and a ferret. You don''t sell ferrets. You''ll figure that out later.'
  successPicture: 'stuff/money_bag_2'
