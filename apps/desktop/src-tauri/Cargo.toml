[package]
name = "funeral-quest"
version = "0.1.0-alpha.2"
description = "Funeral Quest: a daily-turn game about rival funeral parlors, remastered."
authors = ["FuneralQuest Remastered contributors"]
license-file = "../../../license.txt"
edition = "2021"
rust-version = "1.77"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde_json = "1"

[features]
# Test builds only: lets a script drive the page and report back (used to check the app launches).
selftest = []

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
